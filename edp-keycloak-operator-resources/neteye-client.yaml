apiVersion: v1.edp.epam.com/v1
kind: KeycloakClient
metadata:
  name: keycloakclient-neteye
  namespace: keycloak
spec:
  reconciliationStrategy: full
  realmRef:
    name: keycloakrealm-neteye
    kind: KeycloakRealm

  # --- from "Create NetEye client" task ---
  clientId: neteye
  protocol: openid-connect
  public: false
  enabled: true
  directAccess: true
  standardFlowEnabled: true

  redirectUris:
    - "https://neteye.example.com/*"
    - "https://neteye.example.com/auth/callback"

  serviceAccount:
    enabled: true

    # --- from "Add roles to service-account-neteye" task ---
    clientRoles:
      - clientId: realm-management
        roles:
          - view-users
          - query-users
          - query-groups

  protocolMappers:
    - name: "groups membership"
      protocol: openid-connect
      protocolMapper: oidc-group-membership-mapper
      config:
        full.path: "true"
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        claim.name: groups
        jsonType.label: String
        multivalued: "true"
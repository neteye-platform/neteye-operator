apiVersion: v1
kind: Secret
metadata:
  name: demo-client-secret
  namespace: keycloak
type: Opaque
stringData:
  clientSecret: DemoClientSecret123!
---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakClient
metadata:
  name: demo-oidc-client
  namespace: keycloak
spec:
  realmRef:
    name: demo-realm
    kind: KeycloakRealm
  clientId: demo-client
  public: false                       # confidential client (has a secret)
  secret: "$demo-client-secret:clientSecret"
  clientAuthenticatorType: client-secret
  protocol: openid-connect
  standardFlowEnabled: true           # authorization code flow
  directAccess: true                  # resource owner password flow (useful for testing)
  serviceAccount:
    enabled: true                     # client credentials flow
  webUrl: "https://myapp.example.local"
  redirectUris:
    - "https://myapp.example.local/*"
  webOrigins:
    - "https://myapp.example.local"
  advancedProtocolMappers: true
  reconciliationStrategy: full


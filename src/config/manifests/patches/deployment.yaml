apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  name: neteye-operator.v0.0.0
  namespace: placeholder
spec:
  install:
    spec:
      $patch: replace
      clusterPermissions:
        - serviceAccountName: neteye-operator
          rules:
            - apiGroups: [""]
              resources: [configmaps, services, serviceaccounts, endpoints]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [""]
              resources: [secrets]
              verbs: [create, get, list, update, watch]
            - apiGroups: [""]
              resources: [pods, pods/log]
              verbs: [get, list, watch]
            - apiGroups: [""]
              resources: [namespaces]
              verbs: [create, delete, get, list, watch]
            - apiGroups: [storage.k8s.io]
              resources: [storageclasses]
              verbs: [get, list, watch]
            - apiGroups: [apps]
              resources: [deployments, statefulsets]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [rbac.authorization.k8s.io]
              resources:
                [clusterroles, clusterrolebindings, roles, rolebindings]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [apiextensions.k8s.io]
              resources: [customresourcedefinitions]
              verbs: [get, list, watch]
            - apiGroups: [k8s.keycloak.org]
              resources: [keycloaks]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [olm.operatorframework.io]
              resources: [clusterextensions]
              verbs: [create, get, list, update, watch]
            - apiGroups: [cert-manager.io]
              resources: [certificates]
              verbs: [create, get, list, update, watch]
            - apiGroups: [cert-manager.io]
              resources: [issuers]
              verbs: [get, list, watch]
            - apiGroups: [gateway.networking.k8s.io]
              resources: [gateways, httproutes, grpcroutes]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [cilium.io]
              resources: [ciliumnetworkpolicies]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [networking.k8s.io]
              resources: [networkpolicies]
              verbs: [create, get, list, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [neteyes]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [neteyes/status]
              verbs: [get, patch, update]
            - apiGroups: [neteye.cloud]
              resources: [neteyes/finalizers]
              verbs: [update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakclients]
              verbs: [create, get, list, patch, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [keycloakclients/status]
              verbs: [get, patch, update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakclients/finalizers]
              verbs: [update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakusers]
              verbs: [create, get, list, patch, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [keycloakusers/status]
              verbs: [get, patch, update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakusers/finalizers]
              verbs: [update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakauthflows]
              verbs: [create, get, list, patch, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [keycloakauthflows/status]
              verbs: [get, patch, update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakauthflows/finalizers]
              verbs: [update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakrealms]
              verbs: [create, get, list, patch, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [keycloakrealms/status]
              verbs: [get, patch, update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakrealms/finalizers]
              verbs: [update]
      deployments:
        - name: neteye-operator
          spec:
            replicas: 1
            selector:
              { matchLabels: { app.kubernetes.io/name: neteye-operator } }
            template:
              metadata: { labels: { app.kubernetes.io/name: neteye-operator } }
              spec:
                serviceAccountName: neteye-operator
                securityContext:
                  {
                    runAsNonRoot: true,
                    seccompProfile: { type: RuntimeDefault },
                  }
                containers:
                  - name: manager
                    image: controller:latest
                    imagePullPolicy: Always
                    env:
                      - {
                        name: RELATED_IMAGE_KEYCLOAK,
                        value: ghcr.io/neteye-platform/neteye-keycloak:1.1.0@sha256:8a7f82b6ca3e5a395115ab9c0b8fdbb36895bc2b13dfd0ca112821aabcdb9242,
                      }
                      - {
                        name: RELATED_IMAGE_OTEL_COLLECTOR,
                        value: docker.io/otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6,
                      }
                      - {
                        name: RELATED_IMAGE_EDOT_GATEWAY,
                        value: docker.elastic.co/elastic-agent/elastic-otel-collector:9.5.5@sha256:e167d4a672625d7049f00b631cd2914f94d878377322f5f90dacb199f87e292f,
                      }
                      - {
                        name: RELATED_IMAGE_CA_BUNDLE,
                        value: docker.io/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6,
                      }
                    securityContext:
                      {
                        allowPrivilegeEscalation: false,
                        capabilities: { drop: [ALL] },
                      }
                    ports:
                      [
                        {
                          name: webhook-server,
                          containerPort: 9443,
                          protocol: TCP,
                        },
                      ]
                    resources:
                      limits: { cpu: 200m, memory: 256Mi }
                      requests: { cpu: 100m, memory: 128Mi }
      permissions:
        - serviceAccountName: neteye-operator
          rules:
            - apiGroups: [""]
              resources: [configmaps]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [coordination.k8s.io]
              resources: [leases]
              verbs: [create, get, list, patch, update, watch]
            - apiGroups: [""]
              resources: [events]
              verbs: [create, patch]

apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  name: neteye-operator.v0.0.0
  namespace: placeholder
spec:
  install:
    spec:
      $patch: replace
      clusterPermissions:
        - serviceAccountName: neteye-operator
          rules:
            - apiGroups: [""]
              resources: [configmaps, services, serviceaccounts, endpoints]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [""]
              resources: [secrets]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [""]
              resources: [pods, pods/log]
              verbs: [get, list, watch]
            - apiGroups: [""]
              resources: [namespaces]
              verbs: [create, delete, get, list, patch, watch]
            - apiGroups: [admissionregistration.k8s.io]
              resources:
                [validatingadmissionpolicies, validatingadmissionpolicybindings]
              verbs: [create, get, list, update, watch]
            - apiGroups: [storage.k8s.io]
              resources: [storageclasses]
              verbs: [get, list, watch]
            - apiGroups: [apps]
              resources: [deployments, statefulsets]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [rbac.authorization.k8s.io]
              resources:
                [clusterroles, clusterrolebindings, roles, rolebindings]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [apiextensions.k8s.io]
              resources: [customresourcedefinitions]
              verbs: [get, list, watch]
            - apiGroups: [k8s.keycloak.org]
              resources: [keycloaks]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [olm.operatorframework.io]
              resources: [clusterextensions]
              verbs: [create, get, list, update, watch]
            - apiGroups: [cert-manager.io]
              resources: [certificates]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [cert-manager.io]
              resources: [issuers]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [gateway.networking.k8s.io]
              resources: [gateways, httproutes, grpcroutes]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [networking.k8s.io]
              resources: [networkpolicies]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [cilium.io]
              resources: [ciliumnetworkpolicies]
              verbs: [delete, get]
            - apiGroups: [neteye.cloud]
              resources: [neteyes]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [neteyes/status]
              verbs: [get, patch, update]
            - apiGroups: [neteye.cloud]
              resources: [neteyes/finalizers]
              verbs: [update]
            - apiGroups: [neteye.cloud]
              resources: [neteyeproceduregates]
              verbs: [create, get, list, watch]
            - apiGroups: [neteye.cloud]
              resources: [neteyetenants]
              verbs: [get, list, patch, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [neteyetenants/status]
              verbs: [get, patch, update]
            - apiGroups: [neteye.cloud]
              resources: [neteyetenants/finalizers]
              verbs: [update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakclients]
              verbs: [create, get, list, patch, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [keycloakclients/status]
              verbs: [get, patch, update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakclients/finalizers]
              verbs: [update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakusers]
              verbs: [create, get, list, patch, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [keycloakusers/status]
              verbs: [get, patch, update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakusers/finalizers]
              verbs: [update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakauthflows]
              verbs: [create, get, list, patch, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [keycloakauthflows/status]
              verbs: [get, patch, update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakauthflows/finalizers]
              verbs: [update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakrealms]
              verbs: [create, get, list, patch, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [keycloakrealms/status]
              verbs: [get, patch, update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakrealms/finalizers]
              verbs: [update]
      deployments:
        - name: neteye-operator
          spec:
            replicas: 1
            selector:
              { matchLabels: { app.kubernetes.io/name: neteye-operator } }
            template:
              metadata: { labels: { app.kubernetes.io/name: neteye-operator } }
              spec:
                serviceAccountName: neteye-operator
                securityContext:
                  {
                    runAsNonRoot: true,
                    seccompProfile: { type: RuntimeDefault },
                  }
                containers:
                  - name: manager
                    image: controller:latest
                    imagePullPolicy: Always
                    env:
                      - {
                        name: POD_NAMESPACE,
                        valueFrom: { fieldRef: { fieldPath: metadata.namespace } },
                      }
                      - {
                        name: SERVICE_ACCOUNT_NAME,
                        valueFrom: { fieldRef: { fieldPath: spec.serviceAccountName } },
                      }
                      - {
                        name: RELATED_IMAGE_KEYCLOAK,
                        value: ghcr.io/neteye-platform/neteye-keycloak:1.1.5@sha256:3fe0a76b4625d69fe0552615bb9acbe0748ff84e5d4251d20c4adaf9c0c25806,
                      }
                      - {
                        name: RELATED_IMAGE_OTEL_COLLECTOR,
                        value: docker.io/otel/opentelemetry-collector-contrib:0.166.0@sha256:3e18fe04181de50bdd72e23ad4a4d6214b54351e63d496f1c58127cc4541ad7f,
                      }
                      - {
                        name: RELATED_IMAGE_EDOT_GATEWAY,
                        value: docker.elastic.co/elastic-agent/elastic-otel-collector:9.5.7@sha256:cf610854505d489d151c303fd67c5e740efa2819e84339f1d236db806f4c2161,
                      }
                      - {
                        name: RELATED_IMAGE_GUACAMOLE,
                        value: docker.io/guacamole/guacamole:1.6.0@sha256:f344085e618bb05e22b964b0208dbd06d3468275bac70206f93805245e067b40,
                      }
                      - {
                        name: RELATED_IMAGE_GUACD,
                        value: docker.io/guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f,
                      }
                    securityContext:
                      {
                        allowPrivilegeEscalation: false,
                        capabilities: { drop: [ALL] },
                      }
                    ports:
                      [
                        {
                          name: webhook-server,
                          containerPort: 9443,
                          protocol: TCP,
                        },
                      ]
                    resources:
                      limits: { cpu: 200m, memory: 256Mi }
                      requests: { cpu: 100m, memory: 128Mi }
      permissions:
        - serviceAccountName: neteye-operator
          rules:
            - apiGroups: [""]
              resources: [configmaps]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [coordination.k8s.io]
              resources: [leases]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [""]
              resources: [events]
              verbs: [create, patch]

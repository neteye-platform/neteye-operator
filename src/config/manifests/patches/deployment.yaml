apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  name: neteye-operator.v0.0.0
  namespace: placeholder
spec:
  install:
    spec:
      $patch: replace
      clusterPermissions:
        - serviceAccountName: neteye-operator
          rules:
            - apiGroups: [""]
              resources: [configmaps, services, serviceaccounts, endpoints]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [""]
              resources: [secrets]
              verbs: [create, get, list, update, watch]
            - apiGroups: [""]
              resources: [pods, pods/log]
              verbs: [get, list, watch]
            - apiGroups: [""]
              resources: [namespaces]
              verbs: [create, delete, get, list, patch, watch]
            - apiGroups: [admissionregistration.k8s.io]
              resources:
                [validatingadmissionpolicies, validatingadmissionpolicybindings]
              verbs: [create, get, list, update, watch]
            - apiGroups: [storage.k8s.io]
              resources: [storageclasses]
              verbs: [get, list, watch]
            - apiGroups: [apps]
              resources: [deployments, statefulsets]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [rbac.authorization.k8s.io]
              resources:
                [clusterroles, clusterrolebindings, roles, rolebindings]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [apiextensions.k8s.io]
              resources: [customresourcedefinitions]
              verbs: [get, list, watch]
            - apiGroups: [k8s.keycloak.org]
              resources: [keycloaks]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [olm.operatorframework.io]
              resources: [clusterextensions]
              verbs: [create, get, list, update, watch]
            - apiGroups: [cert-manager.io]
              resources: [certificates]
              verbs: [create, get, list, update, watch]
            - apiGroups: [cert-manager.io]
              resources: [issuers]
              verbs: [get, list, watch]
            - apiGroups: [gateway.networking.k8s.io]
              resources: [gateways, httproutes, grpcroutes]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [networking.k8s.io]
              resources: [networkpolicies]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [cilium.io]
              resources: [ciliumnetworkpolicies]
              verbs: [delete, get]
            - apiGroups: [neteye.cloud]
              resources: [neteyes]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [neteyes/status]
              verbs: [get, patch, update]
            - apiGroups: [neteye.cloud]
              resources: [neteyes/finalizers]
              verbs: [update]
            - apiGroups: [neteye.cloud]
              resources: [neteyeproceduregates]
              verbs: [create, get, list, watch]
            - apiGroups: [neteye.cloud]
              resources: [neteyetenants]
              verbs: [get, list, patch, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [neteyetenants/status]
              verbs: [get, patch, update]
            - apiGroups: [neteye.cloud]
              resources: [neteyetenants/finalizers]
              verbs: [update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakclients]
              verbs: [create, get, list, patch, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [keycloakclients/status]
              verbs: [get, patch, update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakclients/finalizers]
              verbs: [update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakusers]
              verbs: [create, get, list, patch, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [keycloakusers/status]
              verbs: [get, patch, update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakusers/finalizers]
              verbs: [update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakauthflows]
              verbs: [create, get, list, patch, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [keycloakauthflows/status]
              verbs: [get, patch, update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakauthflows/finalizers]
              verbs: [update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakrealms]
              verbs: [create, get, list, patch, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [keycloakrealms/status]
              verbs: [get, patch, update]
            - apiGroups: [neteye.cloud]
              resources: [keycloakrealms/finalizers]
              verbs: [update]
      deployments:
        - name: neteye-operator
          spec:
            replicas: 1
            selector:
              { matchLabels: { app.kubernetes.io/name: neteye-operator } }
            template:
              metadata: { labels: { app.kubernetes.io/name: neteye-operator } }
              spec:
                serviceAccountName: neteye-operator
                securityContext:
                  {
                    runAsNonRoot: true,
                    seccompProfile: { type: RuntimeDefault },
                  }
                containers:
                  - name: manager
                    image: controller:latest
                    imagePullPolicy: Always
                    env:
                      - {
                        name: POD_NAMESPACE,
                        valueFrom: { fieldRef: { fieldPath: metadata.namespace } },
                      }
                      - {
                        name: SERVICE_ACCOUNT_NAME,
                        valueFrom: { fieldRef: { fieldPath: spec.serviceAccountName } },
                      }
                      - {
                        name: RELATED_IMAGE_KEYCLOAK,
                        value: ghcr.io/neteye-platform/neteye-keycloak:1.0.9@sha256:ed3467265ec0fe5ae1b0a82b13f9a0316290be00ef01ce477e5906899db6756f,
                      }
                      - {
                        name: RELATED_IMAGE_OTEL_COLLECTOR,
                        value: docker.io/otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea,
                      }
                      - {
                        name: RELATED_IMAGE_EDOT_GATEWAY,
                        value: docker.elastic.co/elastic-agent/elastic-otel-collector:9.5.6@sha256:9caf6481865156cc1ae52992be3b0596719a849501d677e36f38312e8c8ee0f1,
                      }
                    securityContext:
                      {
                        allowPrivilegeEscalation: false,
                        capabilities: { drop: [ALL] },
                      }
                    ports:
                      [
                        {
                          name: webhook-server,
                          containerPort: 9443,
                          protocol: TCP,
                        },
                      ]
                    resources:
                      limits: { cpu: 200m, memory: 256Mi }
                      requests: { cpu: 100m, memory: 128Mi }
      permissions:
        - serviceAccountName: neteye-operator
          rules:
            - apiGroups: [""]
              resources: [configmaps]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [coordination.k8s.io]
              resources: [leases]
              verbs: [create, get, list, patch, update, watch]
            - apiGroups: [""]
              resources: [events]
              verbs: [create, patch]

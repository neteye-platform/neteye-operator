apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  name: neteye-operator.v0.0.0
  namespace: placeholder
spec:
  install:
    spec:
      $patch: replace
      clusterPermissions:
        - serviceAccountName: neteye-operator
          rules:
            - apiGroups: [""]
              resources: [configmaps, services, serviceaccounts, endpoints]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [""]
              resources: [secrets, pods, pods/log]
              verbs: [get, list, watch]
            - apiGroups: [""]
              resources: [namespaces]
              verbs: [create, delete, get, list, watch]
            - apiGroups: [storage.k8s.io]
              resources: [storageclasses]
              verbs: [get, list, watch]
            - apiGroups: [apps]
              resources: [deployments, statefulsets]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [rbac.authorization.k8s.io]
              resources: [clusterroles, clusterrolebindings, roles, rolebindings]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [apiextensions.k8s.io]
              resources: [customresourcedefinitions]
              verbs: [get, list, watch]
            - apiGroups: [k8s.keycloak.org]
              resources: [keycloaks]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [olm.operatorframework.io]
              resources: [clusterextensions]
              verbs: [create, get, list, update, watch]
            - apiGroups: [cert-manager.io]
              resources: [certificates]
              verbs: [create, get, list, update, watch]
            - apiGroups: [cert-manager.io]
              resources: [issuers]
              verbs: [get, list, watch]
            - apiGroups: [gateway.networking.k8s.io]
              resources: [gateways, httproutes, grpcroutes]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [cilium.io]
              resources: [ciliumnetworkpolicies]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [networking.k8s.io]
              resources: [networkpolicies]
              verbs: [create, get, list, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [neteyes]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [neteye.cloud]
              resources: [neteyes/status]
              verbs: [get, patch, update]
            - apiGroups: [neteye.cloud]
              resources: [neteyes/finalizers]
              verbs: [update]
      deployments:
        - name: neteye-operator
          spec:
            replicas: 1
            selector: {matchLabels: {app.kubernetes.io/name: neteye-operator}}
            template:
              metadata: {labels: {app.kubernetes.io/name: neteye-operator}}
              spec:
                serviceAccountName: neteye-operator
                securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
                containers:
                  - name: manager
                    image: controller:latest
                    imagePullPolicy: Always
                    env:
                      - {name: RELATED_IMAGE_KEYCLOAK, value: ghcr.io/neteye-platform/neteye-keycloak:1.0.1}
                      - {name: RELATED_IMAGE_OTEL_COLLECTOR, value: docker.io/otel/opentelemetry-collector-contrib:0.156.0}
                    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
                    ports: [{name: webhook-server, containerPort: 9443, protocol: TCP}]
                    resources:
                      limits: {cpu: 200m, memory: 256Mi}
                      requests: {cpu: 100m, memory: 128Mi}
      permissions:
        - serviceAccountName: neteye-operator
          rules:
            - apiGroups: [""]
              resources: [configmaps]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [coordination.k8s.io]
              resources: [leases]
              verbs: [create, get, list, patch, update, watch]
            - apiGroups: [""]
              resources: [events]
              verbs: [create, patch]

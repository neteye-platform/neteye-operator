apiVersion: neteye.cloud/v1alpha1
kind: NetEye
metadata:
  name: neteye-sample
  namespace: neteye-tenant-shared
spec:
  version: "4.51"
  # Retain (the default) preserves data-bearing resources and anything a
  # retained workload needs to keep serving when this resource is deleted;
  # Delete removes every owned resource. Referenced resources such as the
  # external database, the cert-manager Issuer, and credential Secrets are
  # never deleted by either policy.
  deletionPolicy: Retain
  gateway:
    name: neteye
    className: cilium
    annotations:
      lbipam.cilium.io/ips: 192.0.2.10
  internalCertificateIssuerRef: neteye-internal-issuer
  identity:
    replicas: 1
    hostname: keycloak.example.com
    # Opt in to Keycloak OTLP export only when elasticStack.enabled is true.
    # Both signals default to false; enable either independently.
    # telemetry:
    #   logsEnabled: true
    #   metricsEnabled: true
    #   # data_stream.namespace defaults to neteye_system_internal. The
    #   # Keycloak service name remains operator-managed (neteye-keycloak).
    #   resourceAttributes:
    #     deployment.environment: production
    podExtraEnvVars:
      - name: JAVA_OPTS_APPEND
        value: -Djava.net.preferIPv6Addresses=true
    additionalOptions:
      - name: spi-connections-http-client--default--connection-pool-size
        value: "20"
    # Extra Keycloak features to enable. The telemetry features stay
    # operator-managed and are enabled through identity.telemetry.
    enabledFeatures:
      - token-exchange
    dbConnection:
      host: mariadb.example.com
      port: 3306
      dbName: keycloak
      usernameSecret: { name: keycloak-db-secret, key: username }
      passwordSecret: { name: keycloak-db-secret, key: password }
  elasticStack:
    enabled: true
    elasticsearchEndpoints:
      - https://192.0.2.10:9200
    telemetry:
      otelCollector: {}
      edotGateway: {}

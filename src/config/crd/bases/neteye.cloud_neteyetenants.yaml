---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: neteyetenants.neteye.cloud
spec:
  group: neteye.cloud
  names:
    kind: NetEyeTenant
    listKind: NetEyeTenantList
    plural: neteyetenants
    shortNames:
    - netenant
    singular: neteyetenant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .status.currentVersion
      name: Current
      priority: 1
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetEyeTenant is the Schema for the neteyetenants API. It represents one
          NetEye tenant and its dedicated resources. It lives in the namespace of the
          tenant and has the same name as that namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetEyeTenantSpec defines the desired state of a NetEye tenant.
            properties:
              caBundle:
                description: |-
                  CABundle selects the optional ConfigMap with extra PEM CA certificates
                  that the components of the tenant trust in addition to their built-in
                  roots. The ConfigMap lives in the namespace of the tenant and may be
                  absent. The default is neteye-ca-bundle/ca-bundle.pem.
                properties:
                  key:
                    default: ca-bundle.pem
                    description: Key is the key inside the ConfigMap holding the PEM
                      bundle.
                    minLength: 1
                    type: string
                  name:
                    description: Name is the name of the ConfigMap containing the
                      referenced value.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              displayName:
                description: |-
                  DisplayName is the name of the tenant that people see and use. It can
                  change at any time; resources derived from the tenant use metadata.name,
                  which never changes. It has at least one letter or digit, so a name made
                  only of blank characters is refused. The length counts characters, not
                  bytes. No two tenants have the same display name.
                maxLength: 63
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: must not contain surrounding whitespace
                  rule: self == self.trim()
                - message: must not contain control or format characters, or line
                    or paragraph separators
                  rule: '!self.matches(''[\\p{Cc}\\p{Cf}\\p{Zl}\\p{Zp}]'')'
                - message: must contain at least one letter or digit
                  rule: self.matches('[\\p{L}\\p{N}]')
              permissionSync:
                description: |-
                  PermissionSync configures the PermissionSync instance of the tenant.
                  PermissionSync runs in every tenant, also without this section: every
                  field is optional and has a default. Keycloak does not call it yet.
                properties:
                  glpi:
                    description: |-
                      GLPI is the GLPI instance of the glpi adapter. A target with the glpi
                      adapter requires it.
                    properties:
                      credentialsSecretRef:
                        description: |-
                          CredentialsSecretRef is the Secret, in the namespace of the tenant, with
                          the application token and the user token of the GLPI API.
                        properties:
                          appTokenKey:
                            description: |-
                              AppTokenKey is the key of the application token. The default is
                              app_token.
                            maxLength: 253
                            type: string
                          name:
                            description: Name is the name of the Secret.
                            maxLength: 253
                            minLength: 1
                            type: string
                          userTokenKey:
                            description: UserTokenKey is the key of the user token.
                              The default is user_token.
                            maxLength: 253
                            type: string
                        required:
                        - name
                        type: object
                      endpoint:
                        description: |-
                          Endpoint is the absolute HTTPS URL of the GLPI REST API, without
                          credentials, query or fragment.
                        maxLength: 2048
                        minLength: 1
                        type: string
                    required:
                    - credentialsSecretRef
                    - endpoint
                    type: object
                  podExtraEnvVars:
                    description: |-
                      PodExtraEnvVars are copied to the PermissionSync container as they are,
                      for example PERMISSIONSYNC_OBSERVABILITY__LOG_LEVEL. The variables that
                      the operator sets itself are refused.
                    items:
                      description: NetEyeEnvVar defines an environment variable.
                      properties:
                        name:
                          description: Name is the environment variable name.
                          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                          type: string
                        value:
                          description: |-
                            Value is the environment variable value. It is stored in plaintext and
                            must not contain secrets.
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  provider:
                    description: |-
                      Provider is the Permission Provider that PermissionSync reads the desired
                      permissions from. Without it, PermissionSync starts and answers only
                      requests without a target.
                    properties:
                      endpoint:
                        description: |-
                          Endpoint is the absolute HTTPS URL of the desired-state API of the
                          provider, without credentials, query or fragment.
                        maxLength: 2048
                        minLength: 1
                        type: string
                    required:
                    - endpoint
                    type: object
                  realm:
                    description: |-
                      Realm is the Keycloak realm whose tokens PermissionSync trusts. The
                      default is the realm of the tenant, which has the name of the tenant.
                    maxLength: 255
                    minLength: 1
                    type: string
                  replicas:
                    description: Replicas is the number of PermissionSync Pods. The
                      default is 2.
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                  targets:
                    description: |-
                      Targets are the logical targets that PermissionSync serves. Without
                      targets, PermissionSync starts and is ready, and a request for any
                      target is refused.
                    items:
                      description: NetEyeTenantPermissionSyncTarget routes one logical
                        target to an adapter.
                      properties:
                        adapter:
                          description: Adapter selects the adapter. glpi is the only
                            adapter.
                          enum:
                          - glpi
                          type: string
                        logicalTarget:
                          description: |-
                            LogicalTarget is the suffix of the permissionsync:<target> scope of the
                            caller token.
                          maxLength: 64
                          minLength: 1
                          type: string
                      required:
                      - adapter
                      - logicalTarget
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-map-keys:
                    - logicalTarget
                    x-kubernetes-list-type: map
                type: object
              useProcedureGates:
                default: true
                description: |-
                  UseProcedureGates makes the operator wait for and create
                  NetEyeProcedureGates in the namespace of the tenant during its installs
                  and upgrades. Disable it where no NetEye Ansible procedure runs and an
                  administrator performs those steps.
                type: boolean
              version:
                description: |-
                  Version is the NetEye product version string of the tenant, e.g. "4.51".
                  The rules are the same as for the version of the NetEye resource: a new
                  tenant uses the version that this operator installs, and an existing
                  tenant can only keep it or upgrade to it from the previous version. A
                  tenant cannot use a newer version than the NetEye resource.
                example: "4.51"
                minLength: 1
                pattern: ^[0-9]+\.[0-9]+$
                type: string
            required:
            - displayName
            - version
            type: object
          status:
            description: |-
              NetEyeTenantStatus defines the observed state of a NetEye tenant. It has the
              same fields as the status of the NetEye resource, apart from the services.
            properties:
              currentVersion:
                description: |-
                  CurrentVersion is the NetEye release whose install or upgrade of the
                  tenant has completed. While it differs from spec.version the operator is
                  installing (when empty) or upgrading the tenant, and waits for the
                  required NetEyeProcedureGates. The NetEye resource can upgrade only when
                  every tenant has completed its version.
                type: string
              message:
                description: Message is a human-readable aggregate status message.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the generation of the most recently observed
                  NetEyeTenant.
                format: int64
                type: integer
              phase:
                description: Phase is the aggregate lifecycle state of the tenant.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be neteye-tenant- followed by an id of 8 characters
            from abcdefghjkmnpqrstuvwxyz23456789
          reason: FieldValueInvalid
          rule: self.metadata.name.matches('^neteye-tenant-[a-hjkmnp-z2-9]{8}$')
    served: true
    storage: true
    subresources:
      status: {}

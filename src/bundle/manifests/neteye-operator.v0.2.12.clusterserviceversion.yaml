apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "neteye.wuerth-phoenix.com/v1alpha1",
          "kind": "NetEye",
          "metadata": {
            "name": "neteye-sample"
          },
          "spec": {
            "neteyeVersion": "4.36",
            "targetNamespace": "neteye-system"
          }
        }
      ]
    capabilities: Basic Install
    operators.operatorframework.io/builder: operator-sdk-v1.32.0
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v3
  name: neteye-operator.v0.2.12
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: >-
        NetEye declares the product version and the target namespace, driving
        component image selection (e.g. Keycloak 27).
      displayName: NetEye
      kind: NetEye
      name: neteyes.neteye.wuerth-phoenix.com
      version: v1alpha1
  description: NetEye Operator for managing cloud-native infrastructure
  displayName: NetEye Operator
  icon:
  - base64data: ""
    mediatype: ""
  install:
    spec:
      clusterPermissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - configmaps
          - secrets
          - services
          - serviceaccounts
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - ""
          resources:
          - pods
          - pods/log
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - ""
          resources:
          - nodes
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - ""
          resources:
          - namespaces
          verbs:
          - create
          - get
          - list
          - watch
        - apiGroups:
          - ""
          resources:
          - endpoints
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - storage.k8s.io
          resources:
          - storageclasses
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - apps
          resources:
          - deployments
          - statefulsets
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - rbac.authorization.k8s.io
          resources:
          - clusterroles
          - clusterrolebindings
          - roles
          - rolebindings
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - apiextensions.k8s.io
          resources:
          - customresourcedefinitions
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - k8s.keycloak.org
          resources:
          - keycloaks
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - olm.operatorframework.io
          resources:
          - clusterextensions
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - neteye.wuerth-phoenix.com
          resources:
          - neteyes
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - neteye.wuerth-phoenix.com
          resources:
          - neteyes/status
          verbs:
          - get
          - patch
          - update
        - apiGroups:
          - neteye.wuerth-phoenix.com
          resources:
          - neteyes/finalizers
          verbs:
          - update
        serviceAccountName: neteye-operator
      deployments:
      - name: neteye-operator
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: neteye-operator
          template:
            metadata:
              labels:
                app.kubernetes.io/name: neteye-operator
            spec:
              containers:
              - image: docker-si.wuerth-phoenix.com/neteye-operator:v0.2.12
                imagePullPolicy: Always
                name: manager
                resources:
                  limits:
                    cpu: 200m
                    memory: 256Mi
                  requests:
                    cpu: 100m
                    memory: 128Mi
              imagePullSecrets:
              - name: neteye-registry-pull-secret
              serviceAccountName: neteye-operator
      permissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - configmaps
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - ""
          resources:
          - events
          verbs:
          - create
          - patch
        serviceAccountName: neteye-operator
    strategy: deployment
  installModes:
  - supported: false
    type: OwnNamespace
  - supported: false
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - neteye
  - operator
  links:
  - name: NetEye
    url: https://www.wuerth-phoenix.com/
  maintainers:
  - email: support@wuerth-phoenix.com
    name: Wuerth Phoenix
  maturity: alpha
  provider:
    name: Wuerth Phoenix
  version: 0.2.12

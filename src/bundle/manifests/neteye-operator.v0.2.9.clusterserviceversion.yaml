        serviceAccountName: neteye-operator
      deployments:
      - name: neteye-operator
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: neteye-operator
          template:
            metadata:
              labels:
                app.kubernetes.io/name: neteye-operator
            spec:
              containers:
              - env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: SERVICE_ACCOUNT_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.serviceAccountName
                - name: RELATED_IMAGE_KEYCLOAK
                  value: ghcr.io/neteye-platform/neteye-keycloak:1.0.9@sha256:ed3467265ec0fe5ae1b0a82b13f9a0316290be00ef01ce477e5906899db6756f
                - name: RELATED_IMAGE_OTEL_COLLECTOR
                  value: docker.io/otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
                - name: RELATED_IMAGE_EDOT_GATEWAY
                  value: docker.elastic.co/elastic-agent/elastic-otel-collector:9.5.6@sha256:9caf6481865156cc1ae52992be3b0596719a849501d677e36f38312e8c8ee0f1
                - name: RELATED_IMAGE_PERMISSIONSYNC
                  value: ghcr.io/neteye-platform/permissionsync:0.2.0@sha256:554bcf1803c2fe7ac52b8a081b4d0727d131647b43a716449f2063dd719a921c
                image: ghcr.io/neteye-platform/neteye-operator:0.2.9
                imagePullPolicy: Always
                name: manager
                ports:
                - containerPort: 9443
                  name: webhook-server
                  protocol: TCP
                resources:
                  limits:
                    cpu: 200m
                    memory: 256Mi
                  requests:
                    cpu: 100m
                    memory: 128Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: neteye-operator

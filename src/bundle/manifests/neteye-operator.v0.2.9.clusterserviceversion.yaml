apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[{"apiVersion":"neteye.cloud/v1alpha1","kind":"NetEye","metadata":{"name":"neteye-sample"},"spec":{"version":"4.51","gateway":{"name":"neteye","className":"cilium"},"internalCertificateIssuerRef":"neteye-internal-issuer","identity":{"hostname":"keycloak.example.com","dbConnection":{"host":"mariadb.example.com","dbName":"keycloak","usernameSecret":{"name":"keycloak-db-secret","key":"username"},"passwordSecret":{"name":"keycloak-db-secret","key":"password"}}},"elasticStack":{"enabled":true,"elasticsearchEndpoints":["https://192.0.2.10:9200"],"telemetry":{"otelCollector":{},"edotGateway":{}}}}}]'
    capabilities: Basic Install
  name: neteye-operator.v0.2.9
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: NetEye declares the product version and reconciles components in
        the same namespace as the NetEye custom resource.
      displayName: NetEye
      kind: NetEye
      name: neteyes.neteye.cloud
      version: v1alpha1
    - description: NetEyeTenant represents one NetEye tenant; it lives in the namespace
        of the tenant, which has the same name, and reconciles the tenant namespace.
      displayName: NetEye Tenant
      kind: NetEyeTenant
      name: neteyetenants.neteye.cloud
      version: v1alpha1
    - description: KeycloakClient declares an OpenID Connect client the operator keeps
        continuously reconciled in the identity service.
      displayName: Keycloak Client
      kind: KeycloakClient
      name: keycloakclients.neteye.cloud
      version: v1alpha1
    - description: KeycloakUser declares a Keycloak account the platform owns and
        keeps reconciled in the identity service.
      displayName: Keycloak User
      kind: KeycloakUser
      name: keycloakusers.neteye.cloud
      version: v1alpha1
    - description: KeycloakAuthFlow declares a Keycloak authentication flow the operator
        keeps continuously reconciled in the identity service.
      displayName: Keycloak Auth Flow
      kind: KeycloakAuthFlow
      name: keycloakauthflows.neteye.cloud
      version: v1alpha1
    - description: KeycloakRealm declares a Keycloak realm the operator keeps continuously
        reconciled in the identity service.
      displayName: Keycloak Realm
      kind: KeycloakRealm
      name: keycloakrealms.neteye.cloud
      version: v1alpha1
    - description: NetEyeProcedureGate records a completed install or upgrade step,
        so the operator and the NetEye Ansible procedure can wait for each other.
      displayName: NetEye Procedure Gate
      kind: NetEyeProcedureGate
      name: neteyeproceduregates.neteye.cloud
      version: v1alpha1
    required:
    - displayName: cert-manager Certificate
      kind: Certificate
      name: certificates.cert-manager.io
      version: v1
    - displayName: cert-manager Issuer
      kind: Issuer
      name: issuers.cert-manager.io
      version: v1
    - displayName: Gateway API HTTPRoute
      kind: HTTPRoute
      name: httproutes.gateway.networking.k8s.io
      version: v1
    - displayName: Gateway API Gateway
      kind: Gateway
      name: gateways.gateway.networking.k8s.io
      version: v1
    - displayName: Kubernetes NetworkPolicy
      kind: NetworkPolicy
      name: networkpolicies.networking.k8s.io
      version: v1
  description: NetEye Operator for managing cloud-native infrastructure
  displayName: NetEye Operator

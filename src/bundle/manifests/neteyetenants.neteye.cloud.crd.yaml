---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: neteyetenants.neteye.cloud
spec:
  group: neteye.cloud
  names:
    kind: NetEyeTenant
    listKind: NetEyeTenantList
    plural: neteyetenants
    shortNames:
    - netenant
    singular: neteyetenant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .status.currentVersion
      name: Current
      priority: 1
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetEyeTenant is the Schema for the neteyetenants API. It represents one
          NetEye tenant and its dedicated resources. It lives in the namespace of the
          tenant and has the same name as that namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NetEyeTenantSpec defines the desired state of a NetEye tenant. The rules
              that tie classisServer to database and objectStorage are checked by the
              validating webhook, not by CEL: OLM refuses a CRD upgrade that adds a
              validation rule to spec.
            properties:
              alyvix:
                description: |-
                  Alyvix enables the Alyvix feature module for the tenant. The images
                  come from the release data of the NetEye resource.
                properties:
                  enabled:
                    default: false
                    description: Enabled enables the Alyvix feature module for the
                      tenant.
                    type: boolean
                  rdp:
                    description: RDP configures the RDP access to the Alyvix sessions.
                    properties:
                      ports:
                        description: |-
                          Ports lists the TCP ports of the RDP service on the Alyvix nodes. The
                          proxy daemon may open connections to these ports on any address. The
                          default is 3389.
                        items:
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        maxItems: 16
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: set
                    type: object
                required:
                - enabled
                type: object
              caBundle:
                description: |-
                  CABundle selects the optional ConfigMap with extra PEM CA certificates
                  that the components of the tenant trust in addition to their built-in
                  roots. The ConfigMap lives in the namespace of the tenant and may be
                  absent. The default is neteye-ca-bundle/ca-bundle.pem.
                properties:
                  key:
                    default: ca-bundle.pem
                    description: Key is the key inside the ConfigMap holding the PEM
                      bundle.
                    minLength: 1
                    type: string
                  name:
                    description: Name is the name of the ConfigMap containing the
                      referenced value.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              classisServer:
                description: |-
                  ClassisServer is the Classis Server of the tenant. When it is not
                  set, the tenant has none. It needs database and objectStorage.
                properties:
                  adminUsersSecretName:
                    description: |-
                      AdminUsersSecretName names a Secret whose basic-users key holds the file
                      of the operator plane users, with their Argon2id password hashes. When it
                      is empty the operator generates one administrator, `admin`: the Secret
                      `classis-server-admin` holds its `username` and `password`, and the Secret
                      `classis-server-admin-users` holds the hash the server reads. Both are
                      created once, never overwritten and never rotated, and they survive the
                      deletion of the tenant resource.
                    maxLength: 253
                    minLength: 1
                    type: string
                  dbConnection:
                    description: |-
                      DBConnection is how the server connects to the PostgreSQL of the tenant.
                      With a local database the operator creates the database and its role,
                      and generates the credentials in the Secret classis-db-credentials, so
                      only dbName may be set. With an external database the database and the
                      role must exist, and usernameSecret and passwordSecret are required.
                    properties:
                      dbName:
                        default: classis
                        description: |-
                          DBName is the database of the server. On a local database it is also the
                          name of the role the operator creates.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z_][a-z0-9_]*$
                        type: string
                      passwordSecret:
                        description: |-
                          PasswordSecret references the Secret key that holds the password. Only
                          for an external database.
                        properties:
                          key:
                            description: Key is the key inside the Secret containing
                              the referenced value.
                            minLength: 1
                            type: string
                          name:
                            description: Name is the name of the Secret containing
                              the referenced value.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      usernameSecret:
                        description: |-
                          UsernameSecret references the Secret key that holds the user name. Only
                          for an external database.
                        properties:
                          key:
                            description: Key is the key inside the Secret containing
                              the referenced value.
                            minLength: 1
                            type: string
                          name:
                            description: Name is the name of the Secret containing
                              the referenced value.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                  enabled:
                    default: true
                    description: |-
                      Enabled runs the server. When false, the operator removes the Deployment
                      and leaves the database, the Service and the policies in place.
                    type: boolean
                  logFormat:
                    default: json
                    description: |-
                      LogFormat is the format of the server log: json for a log collector, text
                      for a person.
                    enum:
                    - json
                    - text
                    type: string
                  logLevel:
                    default: info
                    description: LogLevel is the RUST_LOG filter of the server.
                    maxLength: 256
                    type: string
                  network:
                    description: Network narrows the network policies of the server.
                    properties:
                      adminIngressCIDRs:
                        description: |-
                          AdminIngressCIDRs, when set, are the only sources of the operator plane
                          (4321). When empty, any source reaches it: a native policy cannot select
                          the nodes of the PCS proxy, so the proxy, TLS and the Basic credentials
                          of the plane limit who gets in.
                        items:
                          type: string
                        maxItems: 32
                        type: array
                    type: object
                  objectStorage:
                    description: |-
                      ObjectStorage is the part of the object store of the tenant that the
                      server owns.
                    properties:
                      prefix:
                        default: classis/
                        description: |-
                          Prefix is the key prefix the server owns, ending in a slash. At startup
                          the server deletes the objects under it that no package names, so no
                          other writer may share it.
                        maxLength: 512
                        minLength: 2
                        pattern: ^[^/].*/$
                        type: string
                    type: object
                required:
                - enabled
                type: object
              database:
                description: Database is the PostgreSQL of the tenant, shared by all
                  its services.
                properties:
                  external:
                    description: External is where the external PostgreSQL lives.
                    properties:
                      caSecret:
                        description: |-
                          CASecret references the Secret key of the tenant namespace that holds the
                          PEM of the CA that signs the certificate of the PostgreSQL.
                        properties:
                          key:
                            description: Key is the key inside the Secret containing
                              the referenced value.
                            minLength: 1
                            type: string
                          name:
                            description: Name is the name of the Secret containing
                              the referenced value.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      host:
                        description: Host is the DNS name or the IP address of the
                          PostgreSQL.
                        maxLength: 253
                        minLength: 1
                        type: string
                      port:
                        default: 5432
                        description: Port is the port of the PostgreSQL.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                    required:
                    - caSecret
                    - host
                    type: object
                  local:
                    description: Local tunes the CloudNativePG cluster of the tenant.
                    properties:
                      replicas:
                        default: 2
                        description: |-
                          Replicas is the number of PostgreSQL instances. The instances never share
                          a node (required pod anti-affinity on the node name): with two replicas on
                          a cluster that has a single worker node, the second one stays Pending, so
                          set it to 1 there.
                        format: int32
                        maximum: 5
                        minimum: 1
                        type: integer
                      storageClassName:
                        description: |-
                          StorageClassName is the storage class of the volumes. When empty, the
                          default class is used.
                        maxLength: 253
                        type: string
                      storageSize:
                        default: 5Gi
                        description: StorageSize is the size of the volume of each
                          instance.
                        maxLength: 32
                        type: string
                    type: object
                  provider:
                    description: |-
                      Provider is local for a CloudNativePG cluster that the operator runs in
                      the tenant namespace, or external for a PostgreSQL that someone else runs.
                    enum:
                    - local
                    - external
                    type: string
                required:
                - provider
                type: object
                x-kubernetes-validations:
                - message: provider is immutable
                  rule: self.provider == oldSelf.provider
                - message: external must not be set when provider is local
                  rule: self.provider != 'local' || !has(self.external)
                - message: external is required when provider is external
                  rule: self.provider != 'external' || has(self.external)
                - message: local must not be set when provider is external
                  rule: self.provider != 'external' || !has(self.local)
              displayName:
                description: |-
                  DisplayName is the name of the tenant that people see and use. It can
                  change, except while the tenant is at the previous version: then, as for
                  the NetEye resource, the tenant accepts no change until it upgrades.
                  Resources derived from the tenant use metadata.name, which never changes. It has at least one letter or digit, so a name made
                  only of blank characters is refused; the Hangul fillers, which are
                  letters that show nothing, do not count. The length counts characters,
                  not bytes. Only one tenant holds a display name: the webhook refuses a
                  name that another tenant uses, and when two writes pass the webhook at
                  the same time, the operator gives the name to one tenant and reports the
                  other one as Failed until it gets another display name.
                maxLength: 63
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: must not contain surrounding whitespace
                  rule: self == self.trim()
                - message: must not contain control or format characters, or line
                    or paragraph separators
                  rule: '!self.matches(''[\\p{Cc}\\p{Cf}\\p{Zl}\\p{Zp}]'')'
                - message: must contain at least one letter or digit
                  rule: self.matches('[^\\P{L}\\x{115F}\\x{1160}\\x{3164}\\x{FFA0}]|\\p{N}')
              objectStorage:
                description: |-
                  ObjectStorage is the S3 object store of the tenant, shared by all its
                  services.
                properties:
                  external:
                    description: External is the bucket of the external S3 service.
                    properties:
                      bucket:
                        description: Bucket is the name of the bucket.
                        maxLength: 63
                        minLength: 3
                        type: string
                      credentialsSecretName:
                        description: |-
                          CredentialsSecretName names a Secret of the tenant namespace with the
                          access-key-id and secret-access-key keys. When empty, the services use
                          the workload identity of their platform.
                        maxLength: 253
                        type: string
                      endpoint:
                        description: |-
                          Endpoint is the https URL of the S3 service. When a private CA signs its
                          certificate, the tenant's spec.caBundle holds that CA.
                        maxLength: 512
                        pattern: ^https://.+
                        type: string
                      region:
                        default: us-east-1
                        description: |-
                          Region is the region the requests are signed for. It must be the region
                          of the bucket on a service that checks it.
                        maxLength: 63
                        minLength: 1
                        type: string
                    required:
                    - bucket
                    - endpoint
                    type: object
                  local:
                    description: Local tunes the rustfs instance of the tenant.
                    properties:
                      storageClassName:
                        description: |-
                          StorageClassName is the storage class of the volume. When empty, the
                          default class is used.
                        maxLength: 253
                        type: string
                      storageSize:
                        default: 10Gi
                        description: StorageSize is the size of the volume.
                        maxLength: 32
                        type: string
                    type: object
                  provider:
                    description: |-
                      Provider is local for a single rustfs instance that the operator runs in
                      the tenant namespace, or external for an S3 service that someone else
                      runs.
                    enum:
                    - local
                    - external
                    type: string
                required:
                - provider
                type: object
                x-kubernetes-validations:
                - message: provider is immutable
                  rule: self.provider == oldSelf.provider
                - message: external must not be set when provider is local
                  rule: self.provider != 'local' || !has(self.external)
                - message: external is required when provider is external
                  rule: self.provider != 'external' || has(self.external)
                - message: local must not be set when provider is external
                  rule: self.provider != 'external' || !has(self.local)
              useProcedureGates:
                default: true
                description: |-
                  UseProcedureGates makes the operator wait for and create
                  NetEyeProcedureGates in the namespace of the tenant during its installs
                  and upgrades. Disable it where no NetEye Ansible procedure runs and an
                  administrator performs those steps.
                type: boolean
              version:
                description: |-
                  Version is the NetEye product version string of the tenant, e.g. "4.51".
                  The rules are the same as for the version of the NetEye resource: a new
                  tenant uses the version that this operator installs, and an existing
                  tenant can only keep it or upgrade to it from the previous version. A
                  tenant cannot use a newer version than the NetEye resource.
                example: "4.51"
                minLength: 1
                pattern: ^[0-9]+\.[0-9]+$
                type: string
            required:
            - displayName
            - version
            type: object
          status:
            description: |-
              NetEyeTenantStatus defines the observed state of a NetEye tenant. It has the
              same fields as the status of the NetEye resource, apart from the services.
            properties:
              currentVersion:
                description: |-
                  CurrentVersion is the NetEye release whose install or upgrade of the
                  tenant has completed. While it differs from spec.version the operator is
                  installing (when empty) or upgrading the tenant, and waits for the
                  required NetEyeProcedureGates. The NetEye resource can upgrade only when
                  every tenant has completed its version.
                type: string
              message:
                description: Message is a human-readable aggregate status message.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the generation of the most recently observed
                  NetEyeTenant.
                format: int64
                type: integer
              phase:
                description: Phase is the aggregate lifecycle state of the tenant.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be neteye-tenant- followed by an id of 8 characters
            from abcdefghjkmnpqrstuvwxyz23456789
          reason: FieldValueInvalid
          rule: self.metadata.name.matches('^neteye-tenant-[a-hjkmnp-z2-9]{8}$')
    served: true
    storage: true
    subresources:
      status: {}

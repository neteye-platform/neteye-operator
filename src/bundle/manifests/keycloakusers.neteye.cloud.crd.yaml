---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: keycloakusers.neteye.cloud
spec:
  group: neteye.cloud
  names:
    kind: KeycloakUser
    listKind: KeycloakUserList
    plural: keycloakusers
    shortNames:
    - kcu
    singular: keycloakuser
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.username
      name: Username
      type: string
    - jsonPath: .spec.realm
      name: Realm
      type: string
    - jsonPath: .status.status
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KeycloakUser is the Schema for the keycloakusers API. It describes one
          Keycloak account the platform owns and keeps reconciled in the identity
          service.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              KeycloakUserSpec declares one Keycloak account the platform owns, such as the
              administrative user the operator authenticates as. It is not meant for end
              users: only the fields declared here are reconciled, so anything a person
              changes on their own account outside this spec survives untouched.
            properties:
              credential:
                description: |-
                  Credential declares the account password. When omitted the operator never
                  touches credentials, which is what adopting an existing account needs.
                properties:
                  generate:
                    default: false
                    description: |-
                      Generate makes the operator generate a random password and store it in the
                      Secret referenced by SecretRef, which it creates if missing. When false the
                      password is read from that Secret instead, which must already exist.
                    type: boolean
                  rotationToken:
                    description: |-
                      RotationToken requests a password rotation. Any change to its value makes
                      the operator reset the password once; leaving it untouched keeps the
                      credential create-only. The value itself is opaque and is only compared
                      against status.credentialRotation.
                    example: "2026-08-31"
                    type: string
                  secretRef:
                    description: |-
                      SecretRef references the Secret key holding the password. The Secret lives
                      in the same namespace as this resource.
                    properties:
                      key:
                        description: Key is the key inside the Secret containing the
                          database credential value.
                        minLength: 1
                        type: string
                      name:
                        description: Name is the name of the Secret containing the
                          database credential.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  temporary:
                    default: false
                    description: |-
                      Temporary forces the user to choose a new password at the next login. Use
                      it for accounts a person will own, so the operator does not stay the
                      keeper of a human credential.
                    type: boolean
                required:
                - secretRef
                type: object
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy decides what happens to the Keycloak account when this
                  resource is deleted. The account is removed with the resource unless
                  Orphan is asked for explicitly.
                enum:
                - Orphan
                - Delete
                type: string
              email:
                description: Email is the account email address. It is reconciled
                  only when set.
                type: string
              emailVerified:
                default: false
                description: EmailVerified marks the email address as already verified.
                type: boolean
              enabled:
                default: true
                description: Enabled enables the account in Keycloak.
                type: boolean
              firstName:
                description: |-
                  FirstName is the given name shown in the admin console. It is reconciled
                  only when set.
                type: string
              groups:
                description: |-
                  Groups lists the group paths the account belongs to, following the same
                  nil-versus-empty contract as RealmRoles. The groups must already exist.
                example:
                - /neteye-admins
                items:
                  type: string
                type: array
              lastName:
                description: |-
                  LastName is the family name shown in the admin console. It is reconciled
                  only when set.
                type: string
              realm:
                default: master
                description: |-
                  Realm is the Keycloak realm owning the account. The realm must already
                  exist; the operator does not create realms.
                minLength: 1
                type: string
              realmRoles:
                description: |-
                  RealmRoles lists the realm roles assigned to the account. A nil list means
                  the role mappings are not managed here and are left alone; a declared list
                  is authoritative and roles outside it are unassigned. The roles must
                  already exist in the realm.
                example:
                - admin
                items:
                  type: string
                type: array
              username:
                description: Username is the Keycloak username, unique within the
                  realm.
                example: neteye-internal-keycloak-admin
                minLength: 1
                type: string
            required:
            - username
            type: object
          status:
            description: KeycloakUserStatus defines the observed state of a KeycloakUser.
            properties:
              adopted:
                description: |-
                  Adopted reports that the account already existed when the operator first
                  reconciled it, so its credential was left as it was found.
                type: boolean
              credentialRotation:
                description: |-
                  CredentialRotation echoes the spec.credential.rotationToken the operator
                  last acted on.
                type: string
              message:
                description: Message is a human-readable status message.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the generation of the most recently observed
                  KeycloakUser.
                format: int64
                type: integer
              status:
                description: Status is the observed state of the Keycloak account.
                type: string
              userID:
                description: UserID is the internal Keycloak identifier of the reconciled
                  account.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

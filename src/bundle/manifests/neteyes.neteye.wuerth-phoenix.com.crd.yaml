apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: neteyes.neteye.wuerth-phoenix.com
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: neteye.wuerth-phoenix.com
  names:
    kind: NetEye
    listKind: NetEyeList
    plural: neteyes
    singular: neteye
    shortNames:
    - ne
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Version
      type: string
      jsonPath: .spec.neteyeVersion
    - name: Namespace
      type: string
      jsonPath: .spec.targetNamespace
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        description: >-
          NetEyeConfig declares which NetEye product version is being deployed
          and in which Kubernetes namespace, driving the selection of component
          images (e.g. Keycloak 27).
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: NetEyeConfigSpec defines the desired state of NetEyeConfig.
            type: object
            required:
            - neteyeVersion
            - targetNamespace
            properties:
              neteyeVersion:
                description: >-
                  NetEye product version string (e.g. "4.36"). Used to resolve
                  the correct component images for this deployment.
                type: string
                minLength: 1
                example: "4.36"
              targetNamespace:
                description: >-
                  Kubernetes namespace where NetEye components (Keycloak, …)
                  will be deployed.
                type: string
                minLength: 1
                example: "neteye-system"
          status:
            description: NetEyeConfigStatus defines the observed state of NetEyeConfig.
            type: object
            properties:
              message:
                description: Human-readable status message.
                type: string
              observedGeneration:
                description: Generation of the most recently observed NetEyeConfig.
                type: integer
                format: int64
              phase:
                description: "Phase of the NetEyeConfig: Pending, Ready, Failed."
                type: string
              resolvedKeycloakImage:
                description: >-
                  Keycloak container image resolved from the declared
                  neteyeVersion.
                type: string

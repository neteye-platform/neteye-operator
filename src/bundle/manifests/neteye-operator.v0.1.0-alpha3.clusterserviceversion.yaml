          verbs:
          - create
          - patch
        serviceAccountName: neteye-operator
    strategy: deployment
  installModes:
  - supported: false
    type: OwnNamespace
  - supported: false
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - neteye
  - operator
  links:
  - name: NetEye
    url: https://neteye.guide/
  maintainers:
  - email: info.italy@wuerth-it.com
    name: Wuerth IT | Italy
  maturity: alpha
  minKubeVersion: 1.36.0
  provider:
    name: Wuerth IT | Italy
    url: https://your.domain
  relatedImages:
  - image: ghcr.io/neteye-platform/neteye-keycloak:1.0.1
    name: neteye-keycloak
  - image: docker.io/otel/opentelemetry-collector-contrib:0.156.0
    name: neteye-otel-collector
  version: 0.1.0-alpha3
  webhookdefinitions:
  - admissionReviewVersions:
    - v1
    containerPort: 9443
    deploymentName: neteye-operator
    failurePolicy: Fail
    generateName: vneteye-v1alpha1.neteye.cloud
    rules:
    - apiGroups:
      - neteye.cloud
      apiVersions:
      - v1alpha1
      operations:
      - CREATE
      - UPDATE
      resources:
      - neteyes
      scope: Namespaced
    sideEffects: None
    targetPort: 9443
    type: ValidatingAdmissionWebhook
    webhookPath: /validate-neteye-cloud-v1alpha1-neteye

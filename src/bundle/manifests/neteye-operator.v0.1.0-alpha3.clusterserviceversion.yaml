        serviceAccountName: neteye-operator
      deployments:
      - name: neteye-operator
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: neteye-operator
          template:
            metadata:
              labels:
                app.kubernetes.io/name: neteye-operator
            spec:
              containers:
              - env:
                - name: RELATED_IMAGE_KEYCLOAK
                  value: ghcr.io/neteye-platform/neteye-keycloak:1.0.1
                - name: RELATED_IMAGE_OTEL_COLLECTOR
                  value: docker.io/otel/opentelemetry-collector-contrib:0.156.0
                image: ghcr.io/neteye-platform/neteye-operator:0.1.0-alpha3
                imagePullPolicy: Always
                name: manager
                ports:
                - containerPort: 9443
                  name: webhook-server
                  protocol: TCP
                resources:
                  limits:
                    cpu: 200m
                    memory: 256Mi
                  requests:
                    cpu: 100m
                    memory: 128Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: neteye-operator
      permissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - configmaps
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update

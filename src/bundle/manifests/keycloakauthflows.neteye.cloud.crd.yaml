              executions:
                description: Executions is the ordered, authoritative list of direct
                  child executions.
                items:
                  description: |-
                    KeycloakAuthFlowExecution declares an execution in an authentication flow.
                    It is either an Authenticator execution or a nested Flow.

                    Flow nesting is capped at 3 fixed levels (KeycloakAuthFlowExecution ->
                    KeycloakAuthFlowExecutionL2 -> KeycloakAuthFlowExecutionL3) rather than
                    modeled as a self-referential type: controller-gen cannot generate a valid
                    CRD OpenAPI schema for a recursive Go type, since it truncates the schema
                    at a fixed depth and emits an empty (typeless) items schema beyond it,
                    which the API server rejects as a structural schema violation.
                  properties:
                    alias:
                      description: Alias identifies an authenticator execution where
                        Keycloak exposes an alias.
                      type: string
                    authenticator:
                      description: Authenticator is the Keycloak authenticator provider
                        identifier.
                      type: string
                    config:
                      description: Config configures this authenticator.
                      properties:
                        alias:
                          description: Alias is the human-readable configuration name
                            in Keycloak.
                          type: string
                        values:
                          additionalProperties:
                            type: string
                          description: Values contains the authenticator configuration
                            entries.
                          type: object
                      type: object
                    flow:
                      description: Flow declares a nested subflow in place of an authenticator.
                      properties:
                        alias:
                          description: Alias is the Keycloak flow alias, unique within
                            the realm.
                          minLength: 1
                          type: string
                        executions:
                          description: Executions is the ordered, authoritative list
                            of direct child executions.
                          items:
                            description: |-
                              KeycloakAuthFlowExecutionL2 is KeycloakAuthFlowExecution one level deeper;
                              its own nested Flow is the last allowed level (KeycloakAuthFlowExecutionL3).
                            properties:
                              alias:
                                description: Alias identifies an authenticator execution
                                  where Keycloak exposes an alias.
                                type: string
                              authenticator:
                                description: Authenticator is the Keycloak authenticator
                                  provider identifier.
                                type: string
                              config:
                                description: Config configures this authenticator.
                                properties:
                                  alias:
                                    description: Alias is the human-readable configuration
                                      name in Keycloak.
                                    type: string
                                  values:
                                    additionalProperties:
                                      type: string
                                    description: Values contains the authenticator
                                      configuration entries.
                                    type: object
                                type: object
                              flow:
                                description: Flow declares a nested subflow in place
                                  of an authenticator.
                                properties:
                                  alias:
                                    description: Alias is the Keycloak flow alias,
                                      unique within the realm.
                                    minLength: 1
                                    type: string
                                  executions:
                                    description: |-
                                      Executions is the ordered, authoritative list of direct child executions.
                                      These are leaf executions: a flow at this depth cannot nest a further
                                      subflow.
                                    items:
                                      description: |-
                                        KeycloakAuthFlowExecutionL3 is a leaf execution at the deepest allowed
                                        nesting level: it can only be an Authenticator, never a further subflow.
                                      properties:
                                        alias:
                                          description: Alias identifies an authenticator
                                            execution where Keycloak exposes an alias.
                                          type: string
                                        authenticator:
                                          description: Authenticator is the Keycloak

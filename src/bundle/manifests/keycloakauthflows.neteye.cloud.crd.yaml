                                          minLength: 1
                                          type: string
                                        config:
                                          description: Config configures this authenticator.
                                          properties:
                                            alias:
                                              description: Alias is the human-readable
                                                configuration name in Keycloak.
                                              type: string
                                            values:
                                              additionalProperties:
                                                type: string
                                              description: Values contains the authenticator
                                                configuration entries.
                                              type: object
                                          type: object
                                        requirement:
                                          description: Requirement is the Keycloak
                                            execution requirement, such as REQUIRED
                                            or ALTERNATIVE.
                                          type: string
                                      required:
                                      - authenticator
                                      type: object
                                    type: array
                                  provider:
                                    default: basic-flow
                                    description: Provider is the Keycloak flow provider
                                      identifier.
                                    type: string
                                required:
                                - alias
                                type: object
                              requirement:
                                description: Requirement is the Keycloak execution
                                  requirement, such as REQUIRED or ALTERNATIVE.
                                type: string
                            type: object
                            x-kubernetes-validations:
                            - message: exactly one of authenticator or flow must be

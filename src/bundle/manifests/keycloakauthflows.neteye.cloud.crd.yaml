                      type: object
                    requirement:
                      description: Requirement is the Keycloak execution requirement,
                        such as REQUIRED or ALTERNATIVE.
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of authenticator or flow must be set
                    rule: (has(self.authenticator) && self.authenticator != "") !=
                      has(self.flow)
                  - message: config requires authenticator
                    rule: '!has(self.config) || (has(self.authenticator) && self.authenticator
                      != "")'
                type: array
              provider:
                default: basic-flow
                description: Provider is the Keycloak root-flow provider identifier.
                type: string
              realm:
                default: master
                description: Realm owns the flow and must already exist.
                minLength: 1
                type: string
            required:

            properties:
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              status:
                description: ServiceState is the per-service state reported in NetEyeServiceStatus.Status.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:

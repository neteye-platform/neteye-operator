apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Basic Install
    operators.operatorframework.io/builder: operator-sdk-v1.32.0
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v3
  name: neteye-operator.v0.2.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - name: prometheuses.monitoring.coreos.com
      version: v1
      kind: Prometheus
      displayName: Prometheus
      description: Prometheus monitoring instance
    - name: alertmanagers.monitoring.coreos.com
      version: v1
      kind: Alertmanager
      displayName: Alertmanager
      description: Alertmanager alerting instance
    - name: thanosrulers.monitoring.coreos.com
      version: v1
      kind: ThanosRuler
      displayName: ThanosRuler
      description: ThanosRuler monitoring instance
    - name: scrapeconfigs.monitoring.coreos.com
      version: v1alpha1
      kind: ScrapeConfig
      displayName: ScrapeConfig
      description: Prometheus scrape configuration
    - name: prometheusagents.monitoring.coreos.com
      version: v1alpha1
      kind: PrometheusAgent
      displayName: PrometheusAgent
      description: Prometheus Agent monitoring instance
  description: NetEye Operator for managing cloud-native infrastructure
  displayName: NetEye Operator
  icon:
  - base64data: ""
    mediatype: ""
  install:
    spec:
      clusterPermissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - configmaps
          - secrets
          - services
          - serviceaccounts
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - ""
          resources:
          - pods
          - pods/log
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - ""
          resources:
          - nodes
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - ""
          resources:
          - namespaces
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - ""
          resources:
          - endpoints
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - storage.k8s.io
          resources:
          - storageclasses
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - apps
          resources:
          - deployments
          - statefulsets
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - rbac.authorization.k8s.io
          resources:
          - clusterroles
          - clusterrolebindings
          - roles
          - rolebindings
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - monitoring.coreos.com
          resources:
          - prometheuses
          - prometheusagents
          - alertmanagers
          - thanosrulers
          - scrapeconfigs
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - monitoring.coreos.com
          resources:
          - prometheuses/status
          - prometheusagents/status
          - alertmanagers/status
          - thanosrulers/status
          verbs:
          - get
          - patch
          - update
        - apiGroups:
          - apiextensions.k8s.io
          resources:
          - customresourcedefinitions
          verbs:
          - get
          - list
          - watch
        serviceAccountName: neteye-operator
      deployments:
      - name: neteye-operator
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: neteye-operator
          template:
            metadata:
              labels:
                app.kubernetes.io/name: neteye-operator
            spec:
              containers:
              - args:
                - --log-level=info
                image: docker-si.wuerth-phoenix.com/neteye-operator:v0.1.0
                imagePullPolicy: IfNotPresent
                name: manager
                resources:
                  limits:
                    cpu: 200m
                    memory: 256Mi
                  requests:
                    cpu: 100m
                    memory: 128Mi
              imagePullSecrets:
              - name: neteye-registry-pull-secret
              serviceAccountName: neteye-operator
      permissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - configmaps
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - ""
          resources:
          - events
          verbs:
          - create
          - patch
        serviceAccountName: neteye-operator
    strategy: deployment
  installModes:
  - supported: false
    type: OwnNamespace
  - supported: false
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - neteye
  - operator
  links:
  - name: NetEye
    url: https://www.wuerth-phoenix.com/
  maintainers:
  - email: support@wuerth-phoenix.com
    name: Wuerth Phoenix
  maturity: alpha
  provider:
    name: Wuerth Phoenix
  version: 0.2.0

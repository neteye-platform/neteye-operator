---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: neteyes.neteye.cloud
spec:
  group: neteye.cloud
  names:
    kind: NetEye
    listKind: NetEyeList
    plural: neteyes
    shortNames:
    - ne
    singular: neteye
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .metadata.namespace
      name: Namespace
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetEye is the Schema for the neteyes API.
          It declares which NetEye product version is being deployed and in which
          Kubernetes namespace, driving the selection of component images (e.g. Keycloak 27).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetEyeSpec defines the desired state of NetEyeConfig.
            properties:
              elasticStack:
                description: |-
                  ElasticStack configures the shared telemetry pipeline. Its telemetry group
                  is not independently enabled, and enabling Elastic Stack deploys both the
                  OTel Collector and EDOT Gateway. Images are resolved from release data.
                properties:
                  elasticsearchEndpoints:
                    description: |-
                      ElasticsearchEndpoints is the explicitly configured list of HTTPS
                      Elasticsearch endpoints consumed by both telemetry components. Each
                      endpoint host must be an IP address literal or a DNS name.
                    items:
                      type: string
                    minItems: 1
                    type: array
                  enabled:
                    default: false
                    description: |-
                      Enabled enables the shared telemetry pipeline. Enabling it reconciles both
                      the OTel Collector and EDOT Gateway.
                    type: boolean
                  telemetry:
                    description: |-
                      Telemetry groups the OTel Collector and EDOT Gateway configuration; it is
                      not independently enabled and is required when Enabled is true.
                    properties:
                      edotGateway:
                        description: |-
                          EDOTGateway configures the EDOT Gateway that exports telemetry to
                          Elasticsearch. Its API-key Secret and trusted CA belong here; the image
                          is resolved from release data.
                        properties:
                          apiKeySecret:
                            default:
                              key: api_key
                              name: otel-collector-apm-api-key-secret
                            description: |-
                              APIKeySecret selects the Secret key containing the Elasticsearch API key.
                              The default is otel-collector-apm-api-key-secret/api_key.
                            properties:
                              key:
                                description: Key is the key inside the Secret containing
                                  the referenced value.
                                minLength: 1
                                type: string
                              name:
                                description: Name is the name of the Secret containing
                                  the referenced value.
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          replicas:
                            default: 1
                            description: Replicas is the number of EDOT Gateway replicas
                              to deploy.
                            format: int32
                            minimum: 1
                            type: integer
                          rootCASecretName:
                            default: neteye-root-ca
                            description: RootCASecretName selects the trusted CA for
                              Elasticsearch.
                            minLength: 1
                            type: string
                        type: object
                      otelCollector:
                        description: OTelCollector configures the shared OpenTelemetry
                          Collector.
                        properties:
                          apiKeySecret:
                            default:
                              key: api_key
                              name: otel-collector-icinga-api-key-secret
                            description: |-
                              APIKeySecret selects the Secret key exposed to the collector as the
                              ELASTICSEARCH_API_KEY environment variable. The default is
                              otel-collector-icinga-api-key-secret/api_key.
                            properties:
                              key:
                                description: Key is the key inside the Secret containing
                                  the referenced value.
                                minLength: 1
                                type: string
                              name:
                                description: Name is the name of the Secret containing
                                  the referenced value.
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          basicAuthSecretName:
                            default: otel-collector-basicauth
                            description: |-
                              BasicAuthSecretName selects the Secret containing the collector's ingress
                              basic-auth data. The default is otel-collector-basicauth.
                            minLength: 1
                            type: string
                          replicas:
                            default: 1
                            description: Replicas is the number of OTel Collector
                              replicas to deploy.
                            format: int32
                            minimum: 1
                            type: integer
                          rootCASecretName:
                            default: neteye-root-ca
                            description: |-
                              RootCASecretName selects the trusted CA for the collector. The default is
                              neteye-root-ca. The OIDC issuer is derived from identity.hostname using
                              the fixed master realm and is not configurable.
                            minLength: 1
                            type: string
                        type: object
                    type: object
                required:
                - enabled
                type: object
              gateway:
                description: |-
                  Gateway configures the Gateway API Gateway and default routes managed by
                  NetEye.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: |-
                      Annotations are written to spec.infrastructure.annotations on the Gateway.
                      Use this for implementation-specific settings such as Cilium LB IPAM.
                    example:
                      lbipam.cilium.io/ips: 192.0.2.10
                    type: object
                  className:
                    description: |-
                      ClassName is the GatewayClass used when the operator creates or reconciles
                      the Gateway.
                    example: cilium
                    minLength: 1
                    type: string
                  name:
                    description: |-
                      Name is the Gateway name in the shared NetEye namespace. If it already exists,
                      the operator adopts and reconciles it; otherwise the operator creates it.
                    example: neteye
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - className
                - name
                type: object
              identity:
                description: Identity configures identity services such as Keycloak.
                properties:
                  additionalOptions:
                    description: |-
                      AdditionalOptions lists non-sensitive Keycloak server options. Options
                      managed by the operator cannot be configured here.
                    items:
                      description: NetEyeKeycloakOption defines an additional Keycloak
                        server option.
                      properties:
                        name:
                          description: Name is the Keycloak server option name.
                          minLength: 1
                          pattern: ^[a-z][a-z0-9-]*$
                          type: string
                        value:
                          description: |-
                            Value is the Keycloak server option value. It is stored in plaintext in the
                            NetEye and Keycloak resources and must not contain secrets.
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  dbConnection:
                    description: |-
                      DBConnection configures the MariaDB database used by identity services.
                      Credential Secrets must exist in the shared Keycloak workload namespace.
                    properties:
                      dbName:
                        default: keycloak
                        description: DBName is the database name used by Keycloak.
                        example: keycloak
                        minLength: 1
                        type: string
                      host:
                        description: Host is the DNS name or IP address of the external
                          service.
                        example: mariadb.example.com
                        minLength: 1
                        type: string
                      passwordSecret:
                        default:
                          key: password
                          name: keycloak-db-credentials
                        description: |-
                          PasswordSecret references the Secret key containing the database password.
                          The Secret must exist in the shared Keycloak workload namespace.
                        properties:
                          key:
                            description: Key is the key inside the Secret containing
                              the referenced value.
                            minLength: 1
                            type: string
                          name:
                            description: Name is the name of the Secret containing
                              the referenced value.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      port:
                        default: 3306
                        description: Port is the service port.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      usernameSecret:
                        default:
                          key: username
                          name: keycloak-db-credentials
                        description: |-
                          UsernameSecret references the Secret key containing the database username.
                          The Secret must exist in the shared Keycloak workload namespace.
                        properties:
                          key:
                            description: Key is the key inside the Secret containing
                              the referenced value.
                            minLength: 1
                            type: string
                          name:
                            description: Name is the name of the Secret containing
                              the referenced value.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - host
                    type: object
                  enabledFeatures:
                    description: |-
                      EnabledFeatures lists additional Keycloak features to enable, in the
                      Keycloak feature-name form optionally suffixed with a version
                      (for example "token-exchange" or "admin-fine-grained-authz:v2").
                      Features managed by the operator cannot be requested here; the telemetry
                      features are enabled through Telemetry instead.
                    example:
                    - token-exchange
                    items:
                      minLength: 1
                      pattern: ^[a-z][a-z0-9-]*(:v[0-9]+)?$
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  hostname:
                    description: Hostname is the public hostname configured for the
                      identity service.
                    example: keycloak.example.com
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?\.)+[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  podExtraEnvVars:
                    description: |-
                      PodExtraEnvVars lists extra non-sensitive environment variables for
                      Keycloak pods.
                    items:
                      description: NetEyeEnvVar defines an environment variable.
                      properties:
                        name:
                          description: Name is the environment variable name.
                          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                          type: string
                        value:
                          description: |-
                            Value is the environment variable value. It is stored in plaintext and
                            must not contain secrets.
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  replicas:
                    default: 1
                    description: Replicas is the number of identity service replicas
                      to deploy.
                    format: int32
                    minimum: 1
                    type: integer
                  telemetry:
                    description: |-
                      Telemetry configures opt-in identity service telemetry export to the shared
                      EDOT Gateway. Each signal is disabled by default.
                    properties:
                      logsEnabled:
                        default: false
                        description: LogsEnabled exports Keycloak logs through the
                          EDOT Gateway.
                        type: boolean
                      metricsEnabled:
                        default: false
                        description: MetricsEnabled exports Keycloak metrics through
                          the EDOT Gateway.
                        type: boolean
                      resourceAttributes:
                        additionalProperties:
                          type: string
                        description: |-
                          ResourceAttributes adds OpenTelemetry resource attributes to Keycloak
                          telemetry. When either signal is enabled, attributes are merged over the
                          default data_stream.namespace=neteye_system_internal. The service.name
                          attribute is forbidden because the operator owns the Keycloak service name
                          (neteye-keycloak).
                        type: object
                    type: object
                required:
                - dbConnection
                - hostname
                type: object
              internalCertificateIssuerRef:
                description: |-
                  InternalCertificateIssuerRef is the cert-manager Issuer name used for TLS
                  certificates consumed by common NetEye components. The Issuer must already
                  exist in the shared NetEye namespace and is managed by the user.
                example: neteye-internal-issuer
                minLength: 1
                type: string
              permissionSync:
                description: |-
                  PermissionSync configures the PermissionSync service, which reconciles a
                  user's desired permissions with a selected target on login. The service
                  is part of every NetEye deployment and cannot be switched off, so this
                  section is required; its image is resolved from release data.
                properties:
                  authentication:
                    default: {}
                    description: |-
                      Authentication bounds technical-caller token verification. The issuer,
                      the audience, and the signing-algorithm allowlist are not configurable:
                      they are the integration contract, derived from the identity service.
                    properties:
                      cacheFreshnessMilliseconds:
                        default: 300000
                        description: |-
                          CacheFreshnessMilliseconds is how long retained verification material
                          counts as fresh.
                        format: int64
                        minimum: 1
                        type: integer
                      cacheStaleIfErrorMilliseconds:
                        default: 600000
                        description: |-
                          CacheStaleIfErrorMilliseconds is the additional bounded window in which
                          still-usable material may verify a token while the metadata source is
                          unavailable. Readiness stays true for that whole window. Zero disables
                          the grace, which makes readiness depend on the metadata source being
                          reachable within the freshness window.
                        format: int64
                        minimum: 0
                        type: integer
                      clockSkewMilliseconds:
                        default: 30000
                        description: |-
                          ClockSkewMilliseconds is the bounded clock skew allowance applied to
                          token time claims.
                        format: int64
                        maximum: 300000
                        minimum: 0
                        type: integer
                      metadataOperationTimeoutMilliseconds:
                        default: 3000
                        description: |-
                          MetadataOperationTimeoutMilliseconds bounds one JWKS or OIDC discovery
                          retrieval. It must be positive and no greater than the overall request
                          deadline.
                        format: int64
                        minimum: 1
                        type: integer
                    type: object
                  glpi:
                    description: |-
                      GLPI configures the one process-wide GLPI backend. It is required as soon
                      as a target selects the glpi adapter; without it such a target stays
                      recognized but unavailable.
                    properties:
                      authenticationSource:
                        description: |-
                          AuthenticationSource is the GLPI authentication source used when creating
                          a missing GLPI user. When omitted, GLPI's own defaults apply.
                        properties:
                          authType:
                            description: AuthType is the GLPI authtype value.
                            example: 3
                            format: int64
                            type: integer
                          authsId:
                            description: AuthsID is the GLPI auths_id value.
                            example: 2
                            format: int64
                            type: integer
                        required:
                        - authType
                        - authsId
                        type: object
                      credentialsSecret:
                        default:
                          appTokenKey: app_token
                          name: permissionsync-glpi-credentials
                          userTokenKey: user_token
                        description: |-
                          CredentialsSecret selects the user-managed Secret holding the GLPI app
                          token and the service account's user token. The Secret must exist in the
                          shared NetEye namespace.
                        properties:
                          appTokenKey:
                            default: app_token
                            description: AppTokenKey is the key holding the GLPI application
                              token.
                            minLength: 1
                            type: string
                          name:
                            description: Name is the name of the Secret carrying both
                              tokens.
                            minLength: 1
                            type: string
                          userTokenKey:
                            default: user_token
                            description: UserTokenKey is the key holding the GLPI
                              service account's user token.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      endpoint:
                        default: https://glpi.neteyelocal/apirest.php
                        description: |-
                          Endpoint is the GLPI REST API entry point. It defaults to the GLPI the
                          NetEye deployment provides.
                        pattern: ^https://[^\s?#]+$
                        type: string
                    type: object
                  logLevel:
                    default: info
                    description: |-
                      LogLevel is the bounded log-level threshold of PermissionSync's
                      structured JSON log output. The format and its redaction rules are fixed.
                    enum:
                    - error
                    - warn
                    - info
                    - debug
                    - trace
                    type: string
                  operationTimeoutMilliseconds:
                    default: 5000
                    description: |-
                      OperationTimeoutMilliseconds bounds one Permission Provider or GLPI
                      operation. It must be positive and no greater than the overall request
                      deadline.
                    format: int64
                    minimum: 1
                    type: integer
                  provider:
                    default: {}
                    description: |-
                      Provider configures the process-wide Permission Provider PermissionSync
                      reads a user's desired permissions from. It is always the NetEye
                      deployment's own API, so the section defaults to it and an installation
                      never has to name it.
                    properties:
                      endpoint:
                        default: https://httpd.neteyelocal/neteye/api/v2/permission-provider/desired-state
                        description: |-
                          Endpoint is one complete HTTPS request URI, with no query or fragment.
                          PermissionSync appends nothing to it. It defaults to the NetEye
                          deployment's own permission API, which is where every installation reads
                          a user's desired permissions from; override it only for a deployment
                          that serves that API somewhere else.
                        pattern: ^https://[^\s?#]+$
                        type: string
                    type: object
                  replicas:
                    default: 2
                    description: |-
                      Replicas is the number of PermissionSync replicas to deploy. The service
                      is stateless, so any healthy replica can serve any request.
                    format: int32
                    minimum: 1
                    type: integer
                  request:
                    default: {}
                    description: |-
                      Request bounds one synchronization request and the inbound capacity
                      around it.
                    properties:
                      inboundAdmissionLimit:
                        default: 64
                        description: |-
                          InboundAdmissionLimit bounds both how many synchronization requests may
                          be admitted at once and how many more may wait for admission. A request
                          arriving when both bounds are full is refused at the transport boundary
                          and receives no response, so saturation adds no caller-facing status.
                        format: int64
                        minimum: 1
                        type: integer
                      overallDeadlineMilliseconds:
                        default: 10000
                        description: |-
                          OverallDeadlineMilliseconds is the one absolute deadline for a
                          synchronization request. It starts when the request is accepted and
                          covers admission waiting, body collection, authentication, validation,
                          routing, capacity, Provider, and Adapter work. Configure it below the
                          caller's own HTTP timeout.
                        format: int64
                        minimum: 1
                        type: integer
                      synchronizationCapacity:
                        default: 16
                        description: |-
                          SynchronizationCapacity bounds how many selected-target
                          synchronizations run concurrently. It bounds resource use only: it is
                          not an ordering or exclusion primitive, and concurrent requests for the
                          same user are allowed and unordered.
                        format: int64
                        maximum: 1024
                        minimum: 1
                        type: integer
                    type: object
                  rootCASecretName:
                    default: neteye-root-ca
                    description: |-
                      RootCASecretName selects the Secret whose tls.crt is trusted, in addition
                      to the system roots, when PermissionSync connects to the identity
                      service, the Permission Provider, and GLPI. Set it to the empty string to
                      trust only the system roots.
                    type: string
                  shutdown:
                    default: {}
                    description: Shutdown bounds the graceful shutdown of in-flight
                      requests.
                    properties:
                      graceMilliseconds:
                        default: 20000
                        description: |-
                          GraceMilliseconds is how long already admitted requests may finish after
                          shutdown begins. It must be at least the overall request deadline, so
                          every compliant request accepted before shutdown has time to return. The
                          pod's termination grace period covers this plus PermissionSync's fixed
                          post-grace phases and is not configurable here.
                        format: int64
                        minimum: 1
                        type: integer
                    type: object
                  targets:
                    description: |-
                      Targets declares the logical target routes PermissionSync serves. A
                      logical target is matched exactly against the suffix of the caller's
                      permissionsync:<target> scope, and the login-sync authenticator derives
                      that target from the Keycloak client the user logs in to, so each entry
                      must be named after that client.
                    items:
                      description: NetEyePermissionSyncTarget routes one logical target
                        to one Target Adapter.
                      properties:
                        adapter:
                          description: Adapter is the Target Adapter serving this
                            logical target.
                          enum:
                          - glpi
                          type: string
                        logicalTarget:
                          description: |-
                            LogicalTarget is the logical target identifier, which must satisfy
                            PermissionSync's target grammar and name the Keycloak login client the
                            login-sync authenticator derives the target from.
                          example: glpi
                          maxLength: 64
                          minLength: 1
                          pattern: ^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$
                          type: string
                      required:
                      - adapter
                      - logicalTarget
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - logicalTarget
                    x-kubernetes-list-type: map
                type: object
              version:
                description: |-
                  Version is the NetEye product version string, e.g. "4.51".
                  It is used to resolve the correct component images (Keycloak, etc.).
                example: "4.51"
                minLength: 1
                pattern: ^[0-9]+\.[0-9]+$
                type: string
            required:
            - gateway
            - identity
            - internalCertificateIssuerRef
            - permissionSync
            - version
            type: object
          status:
            description: NetEyeStatus defines the observed state of NetEyeConfig.
            properties:
              message:
                description: Message is a human-readable aggregate status message.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the generation of the most recently observed
                  NetEye.
                format: int64
                type: integer
              phase:
                description: NetEyePhase is the aggregate lifecycle state reported
                  in NetEyeStatus.Phase.
                type: string
              servicesStatus:
                description: ServicesStatus reports observed state for each managed
                  NetEye service.
                properties:
                  elasticStack:
                    description: NetEyeElasticStackStatus reports observed state for
                      Elastic Stack components.
                    properties:
                      edotGateway:
                        description: EDOTGateway reports the observed state of the
                          EDOT Gateway.
                        properties:
                          message:
                            description: Message is a human-readable status message
                              for this service.
                            type: string
                          resolvedImage:
                            description: ResolvedImage is the container image resolved
                              for this service.
                            type: string
                          status:
                            description: ServiceState is the per-service state reported
                              in NetEyeServiceStatus.Status.
                            type: string
                        type: object
                      message:
                        description: Message is a human-readable status message for
                          the Elastic Stack feature module.
                        type: string
                      otelCollector:
                        description: OTelCollector reports the observed state of the
                          shared OpenTelemetry Collector.
                        properties:
                          message:
                            description: Message is a human-readable status message
                              for this service.
                            type: string
                          resolvedImage:
                            description: ResolvedImage is the container image resolved
                              for this service.
                            type: string
                          status:
                            description: ServiceState is the per-service state reported
                              in NetEyeServiceStatus.Status.
                            type: string
                        type: object
                      status:
                        description: Status is the observed state of the Elastic Stack
                          feature module.
                        type: string
                    type: object
                  identity:
                    description: Identity reports the observed state of identity services
                      such as Keycloak.
                    properties:
                      message:
                        description: Message is a human-readable status message for
                          this service.
                        type: string
                      resolvedImage:
                        description: ResolvedImage is the container image resolved
                          for this service.
                        type: string
                      status:
                        description: ServiceState is the per-service state reported
                          in NetEyeServiceStatus.Status.
                        type: string
                    type: object
                  permissionSync:
                    description: PermissionSync reports the observed state of the
                      PermissionSync service.
                    properties:
                      message:
                        description: Message is a human-readable status message for
                          this service.
                        type: string
                      resolvedImage:
                        description: ResolvedImage is the container image resolved
                          for this service.
                        type: string
                      status:
                        description: ServiceState is the per-service state reported
                          in NetEyeServiceStatus.Status.
                        type: string
                    type: object
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

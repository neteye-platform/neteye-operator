---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: neteyes.neteye.cloud
spec:
  group: neteye.cloud
  names:
    kind: NetEye
    listKind: NetEyeList
    plural: neteyes
    shortNames:
    - ne
    singular: neteye
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .metadata.namespace
      name: Namespace
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.currentVersion
      name: Current
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetEye is the Schema for the neteyes API.
          It declares which NetEye product version is being deployed and in which
          Kubernetes namespace, driving the selection of component images (e.g. Keycloak 27).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetEyeSpec defines the desired state of NetEyeConfig.
            properties:
              elasticStack:
                description: |-
                  ElasticStack configures the shared telemetry pipeline. Its telemetry group
                  is not independently enabled, and enabling Elastic Stack deploys both the
                  OTel Collector and EDOT Gateway. Images are resolved from release data.
                properties:
                  elasticsearchEndpoints:
                    description: |-
                      ElasticsearchEndpoints is the explicitly configured list of HTTPS
                      Elasticsearch endpoints consumed by both telemetry components. Each
                      endpoint host must be an IP address literal or a DNS name.
                    items:
                      type: string
                    minItems: 1
                    type: array
                  enabled:
                    default: false
                    description: |-
                      Enabled enables the shared telemetry pipeline. Enabling it reconciles both
                      the OTel Collector and EDOT Gateway.
                    type: boolean
                  telemetry:
                    description: |-
                      Telemetry groups the OTel Collector and EDOT Gateway configuration; it is
                      not independently enabled and is required when Enabled is true.
                    properties:
                      edotGateway:
                        description: |-
                          EDOTGateway configures the EDOT Gateway that exports telemetry to
                          Elasticsearch. Its API-key Secret and trusted CA belong here; the image
                          is resolved from release data.
                        properties:
                          apiKeySecret:
                            default:
                              key: api_key
                              name: otel-collector-apm-api-key-secret
                            description: |-
                              APIKeySecret selects the Secret key containing the Elasticsearch API key.
                              The default is otel-collector-apm-api-key-secret/api_key.
                            properties:
                              key:
                                description: Key is the key inside the Secret containing
                                  the referenced value.
                                minLength: 1
                                type: string
                              name:
                                description: Name is the name of the Secret containing
                                  the referenced value.
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          replicas:
                            default: 1
                            description: Replicas is the number of EDOT Gateway replicas
                              to deploy.
                            format: int32
                            minimum: 1
                            type: integer
                          rootCASecretName:
                            default: neteye-root-ca
                            description: RootCASecretName selects the trusted CA for
                              Elasticsearch.
                            minLength: 1
                            type: string
                        type: object
                      otelCollector:
                        description: OTelCollector configures the shared OpenTelemetry
                          Collector.
                        properties:
                          apiKeySecret:
                            default:
                              key: api_key
                              name: otel-collector-icinga-api-key-secret
                            description: |-
                              APIKeySecret selects the Secret key exposed to the collector as the
                              ELASTICSEARCH_API_KEY environment variable. The default is
                              otel-collector-icinga-api-key-secret/api_key.
                            properties:
                              key:
                                description: Key is the key inside the Secret containing
                                  the referenced value.
                                minLength: 1
                                type: string
                              name:
                                description: Name is the name of the Secret containing
                                  the referenced value.
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          basicAuthSecretName:
                            default: otel-collector-basicauth
                            description: |-
                              BasicAuthSecretName selects the Secret containing the collector's ingress
                              basic-auth data. The default is otel-collector-basicauth.
                            minLength: 1
                            type: string
                          replicas:
                            default: 1
                            description: Replicas is the number of OTel Collector
                              replicas to deploy.
                            format: int32
                            minimum: 1
                            type: integer
                          rootCASecretName:
                            default: neteye-root-ca
                            description: |-
                              RootCASecretName selects the trusted CA for the collector. The default is
                              neteye-root-ca. The OIDC issuer is derived from identity.hostname using
                              the fixed master realm and is not configurable.
                            minLength: 1
                            type: string
                        type: object
                    type: object
                required:
                - enabled
                type: object
              gateway:
                description: |-
                  Gateway configures the Gateway API Gateway and default routes managed by
                  NetEye.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: |-
                      Annotations are written to spec.infrastructure.annotations on the Gateway.
                      Use this for implementation-specific settings such as Cilium LB IPAM.
                    example:
                      lbipam.cilium.io/ips: 192.0.2.10
                    type: object
                  className:
                    description: |-
                      ClassName is the GatewayClass used when the operator creates or reconciles
                      the Gateway.
                    example: cilium
                    minLength: 1
                    type: string
                  name:
                    description: |-
                      Name is the Gateway name in the shared NetEye namespace. If it already exists,
                      the operator adopts and reconciles it; otherwise the operator creates it.
                    example: neteye
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - className
                - name
                type: object
              identity:
                description: Identity configures identity services such as Keycloak.
                properties:
                  additionalOptions:
                    description: |-
                      AdditionalOptions lists non-sensitive Keycloak server options. Options
                      managed by the operator cannot be configured here.
                    items:
                      description: NetEyeKeycloakOption defines an additional Keycloak
                        server option.
                      properties:
                        name:
                          description: Name is the Keycloak server option name.
                          minLength: 1
                          pattern: ^[a-z][a-z0-9-]*$
                          type: string
                        value:
                          description: |-
                            Value is the Keycloak server option value. It is stored in plaintext in the
                            NetEye and Keycloak resources and must not contain secrets.
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  dbConnection:
                    description: |-
                      DBConnection configures the MariaDB database used by identity services.
                      Credential Secrets must exist in the shared Keycloak workload namespace.
                    properties:
                      dbName:
                        default: keycloak
                        description: DBName is the database name used by Keycloak.
                        example: keycloak
                        minLength: 1
                        type: string
                      host:
                        description: Host is the DNS name or IP address of the external
                          service.
                        example: mariadb.example.com
                        minLength: 1
                        type: string
                      passwordSecret:
                        default:
                          key: password
                          name: keycloak-db-credentials
                        description: |-
                          PasswordSecret references the Secret key containing the database password.
                          The Secret must exist in the shared Keycloak workload namespace.
                        properties:
                          key:
                            description: Key is the key inside the Secret containing
                              the referenced value.
                            minLength: 1
                            type: string
                          name:
                            description: Name is the name of the Secret containing
                              the referenced value.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      port:
                        default: 3306
                        description: Port is the service port.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      usernameSecret:
                        default:
                          key: username
                          name: keycloak-db-credentials
                        description: |-
                          UsernameSecret references the Secret key containing the database username.
                          The Secret must exist in the shared Keycloak workload namespace.
                        properties:
                          key:
                            description: Key is the key inside the Secret containing
                              the referenced value.
                            minLength: 1
                            type: string
                          name:
                            description: Name is the name of the Secret containing
                              the referenced value.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - host
                    type: object
                  enabledFeatures:
                    description: |-
                      EnabledFeatures lists additional Keycloak features to enable, in the
                      Keycloak feature-name form optionally suffixed with a version
                      (for example "token-exchange" or "admin-fine-grained-authz:v2").
                      Features managed by the operator cannot be requested here; the telemetry
                      features are enabled through Telemetry instead.
                    example:
                    - token-exchange
                    items:
                      minLength: 1
                      pattern: ^[a-z][a-z0-9-]*(:v[0-9]+)?$
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  hostname:
                    description: Hostname is the public hostname configured for the
                      identity service.
                    example: keycloak.example.com
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?\.)+[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  podExtraEnvVars:
                    description: |-
                      PodExtraEnvVars lists extra non-sensitive environment variables for
                      Keycloak pods.
                    items:
                      description: NetEyeEnvVar defines an environment variable.
                      properties:
                        name:
                          description: Name is the environment variable name.
                          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                          type: string
                        value:
                          description: |-
                            Value is the environment variable value. It is stored in plaintext and
                            must not contain secrets.
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  replicas:
                    default: 1
                    description: Replicas is the number of identity service replicas
                      to deploy.
                    format: int32
                    minimum: 1
                    type: integer
                  telemetry:
                    description: |-
                      Telemetry configures opt-in identity service telemetry export to the shared
                      EDOT Gateway. Each signal is disabled by default.
                    properties:
                      logsEnabled:
                        default: false
                        description: LogsEnabled exports Keycloak logs through the
                          EDOT Gateway.
                        type: boolean
                      metricsEnabled:
                        default: false
                        description: MetricsEnabled exports Keycloak metrics through
                          the EDOT Gateway.
                        type: boolean
                      resourceAttributes:
                        additionalProperties:
                          type: string
                        description: |-
                          ResourceAttributes adds OpenTelemetry resource attributes to Keycloak
                          telemetry. When either signal is enabled, attributes are merged over the
                          default data_stream.namespace=neteye_system_internal. The service.name
                          attribute is forbidden because the operator owns the Keycloak service name
                          (neteye-keycloak).
                        type: object
                    type: object
                required:
                - dbConnection
                - hostname
                type: object
              internalCertificateIssuerRef:
                description: |-
                  InternalCertificateIssuerRef is the cert-manager Issuer name used for TLS
                  certificates consumed by common NetEye components. The Issuer must already
                  exist in the shared NetEye namespace and is managed by the user.
                example: neteye-internal-issuer
                minLength: 1
                type: string
              version:
                description: |-
                  Version is the NetEye product version string, e.g. "4.51".
                  It is used to resolve the correct component images (Keycloak, etc.).
                example: "4.51"
                minLength: 1
                pattern: ^[0-9]+\.[0-9]+$
                type: string
            required:
            - gateway
            - identity
            - internalCertificateIssuerRef
            - version
            type: object
          status:
            description: NetEyeStatus defines the observed state of NetEyeConfig.
            properties:
              components:
                additionalProperties:
                  description: NetEyeComponentStatus reports the observed state of
                    one logical component.
                  properties:
                    blockingDependencies:
                      description: |-
                        BlockingDependencies lists the prerequisite components that are not
                        ready. It is only set when Status is Blocked.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    message:
                      description: |-
                        Message is a concise explanation for humans and is not a
                        machine-readable API.
                      type: string
                    observedGeneration:
                      description: ObservedGeneration is the NetEye generation this
                        entry describes.
                      format: int64
                      type: integer
                    reason:
                      description: Reason is a stable, machine-readable identifier
                        for the current state.
                      type: string
                    resolvedImages:
                      description: |-
                        ResolvedImages is the complete set of container images the operator
                        selected for this component. A component with no container images
                        reports an empty list. While the component is progressing this is the
                        target set; once it is ready, the operator has confirmed its required
                        workloads use that set.
                      items:
                        description: |-
                          NetEyeResolvedImage is one container image selected by the operator for a
                          component. Name is a stable logical identifier within that component, and
                          Image is a complete OCI reference pinned by digest.
                        properties:
                          image:
                            description: Image is the exact, digest-pinned image reference.
                            type: string
                          name:
                            description: Name is the stable logical image name within
                              its component.
                            type: string
                        required:
                        - image
                        - name
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    status:
                      description: Status is the component's readiness state.
                      type: string
                  type: object
                description: |-
                  Components reports observed state keyed by stable logical component
                  name. The map is dynamic because components are added as NetEye moves to
                  Kubernetes: adding a key is backward compatible, and callers must
                  tolerate component keys they do not recognize.
                type: object
              conditions:
                description: |-
                  Conditions is the stable machine-readable status interface. It uses the
                  Kubernetes standard condition schema. Callers must tolerate condition
                  types they do not recognize.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentVersion:
                description: |-
                  CurrentVersion is the NetEye product release the operator has
                  successfully applied. During an upgrade it can differ from spec.version,
                  and it only advances once every desired component is ready.
                type: string
              message:
                description: Message is a human-readable aggregate status message.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the generation of the most recently observed
                  NetEye.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is the human-readable aggregate lifecycle state. It is a summary
                  for operators reading the resource; automation that needs readiness uses
                  the Ready condition, which can represent independent facts that a single
                  phase value cannot hold at the same time.
                type: string
              servicesStatus:
                description: |-
                  ServicesStatus reports observed state for each managed NetEye service.

                  DEPRECATED: use Components instead. Components is keyed by stable
                  logical component name, so new components can be added without a schema
                  change, and it carries the per-component observedGeneration, reason, and
                  resolvedImages that this field cannot express. ServicesStatus is still
                  written for compatibility and will be removed in a future API version.
                properties:
                  elasticStack:
                    description: NetEyeElasticStackStatus reports observed state for
                      Elastic Stack components.
                    properties:
                      edotGateway:
                        description: EDOTGateway reports the observed state of the
                          EDOT Gateway.
                        properties:
                          message:
                            description: Message is a human-readable status message
                              for this service.
                            type: string
                          resolvedImage:
                            description: ResolvedImage is the container image resolved
                              for this service.
                            type: string
                          status:
                            description: ServiceState is the per-service state reported
                              in NetEyeServiceStatus.Status.
                            type: string
                        type: object
                      message:
                        description: Message is a human-readable status message for
                          the Elastic Stack feature module.
                        type: string
                      otelCollector:
                        description: OTelCollector reports the observed state of the
                          shared OpenTelemetry Collector.
                        properties:
                          message:
                            description: Message is a human-readable status message
                              for this service.
                            type: string
                          resolvedImage:
                            description: ResolvedImage is the container image resolved
                              for this service.
                            type: string
                          status:
                            description: ServiceState is the per-service state reported
                              in NetEyeServiceStatus.Status.
                            type: string
                        type: object
                      status:
                        description: Status is the observed state of the Elastic Stack
                          feature module.
                        type: string
                    type: object
                  identity:
                    description: Identity reports the observed state of identity services
                      such as Keycloak.
                    properties:
                      message:
                        description: Message is a human-readable status message for
                          this service.
                        type: string
                      resolvedImage:
                        description: ResolvedImage is the container image resolved
                          for this service.
                        type: string
                      status:
                        description: ServiceState is the per-service state reported
                          in NetEyeServiceStatus.Status.
                        type: string
                    type: object
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

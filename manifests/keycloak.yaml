apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak-cluster
  namespace: keycloak
spec:
  instances: 2
  image: ghcr.io/neteye-platform/neteye-keycloak:1.0.2
  # ghcr.io/neteye-platform/neteye-keycloak:1.0.2 was built with KC_DB=mariadb baked
  # in (verified via `kc.sh show-config`: "kc.db = mariadb (Persisted)"), which
  # conflicts with our postgres deployment under --optimized. Re-augment at startup
  # instead until a build with KC_DB=postgres is published.
  startOptimized: false
  additionalOptions:
    - name: http-relative-path
      value: /auth
  db:
    vendor: postgres
    host: postgresql-db
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  bootstrapAdmin:
    user:
      secret: keycloak-admin-secret
  http:
    tlsSecret: keycloak-tls-secret
  hostname:
    hostname: keycloak.test.local
  ingress:
    enabled: false

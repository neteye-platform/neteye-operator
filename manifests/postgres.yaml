apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql-db
  namespace: keycloak
spec:
  serviceName: postgresql-db
  replicas: 1
  selector:
    matchLabels: { app: postgresql-db }
  template:
    metadata:
      labels: { app: postgresql-db }
    spec:
      containers:
        - name: postgresql-db
          image: postgres:16
          env:
            - { name: POSTGRES_DB, value: keycloak }
            - { name: POSTGRES_USER, value: keycloak }
            - { name: POSTGRES_PASSWORD, value: keycloakpass }
          ports: [{ containerPort: 5432 }]
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-db
  namespace: keycloak
spec:
  selector: { app: postgresql-db }
  ports: [{ port: 5432 }]
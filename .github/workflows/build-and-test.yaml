name: Build and Test

on:
  pull_request:
    branches:
      - "**"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ENVTEST_K8S_VERSION: "1.36.2"

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Run unit tests
        working-directory: src
        run: go test ./...

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Cache envtest binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/bin/k8s
          key: envtest-${{ runner.os }}-k8s-${{ env.ENVTEST_K8S_VERSION }}

      - name: Set up envtest
        working-directory: src
        run: |
          GOBIN="$(pwd)/bin" go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.24
          ASSETS="$(./bin/setup-envtest use "${ENVTEST_K8S_VERSION}" --bin-dir "$(pwd)/bin" -p path)"
          echo "KUBEBUILDER_ASSETS=$ASSETS" >> "$GITHUB_ENV"

      - name: Run integration tests
        working-directory: src
        run: go test ./controllers/...

  build-operator:
    name: Build operator image
    needs: [unit, integration]
    permissions:
      contents: read
      packages: write
    uses: neteye-platform/repo-commons/.github/workflows/build-docker-image.yaml@7742c5e2a5092511fef6e00e2872f278f5f2bf36 # main
    with:
      working-directory: src
      dockerfile-path: src/Dockerfile
      image-name: neteye-operator
      push: ${{ startsWith(github.ref, 'refs/tags/') }}
    secrets: inherit

  build-bundle:
    name: Build bundle image
    needs: [unit, integration]
    permissions:
      contents: read
      packages: write
    uses: neteye-platform/repo-commons/.github/workflows/build-docker-image.yaml@7742c5e2a5092511fef6e00e2872f278f5f2bf36 # main
    with:
      working-directory: src
      dockerfile-path: src/Dockerfile.bundle
      image-name: neteye-operator-bundle
      push: ${{ startsWith(github.ref, 'refs/tags/') }}
    secrets: inherit

name: Build and Test

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ENVTEST_K8S_VERSION: "1.36.2"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test release metadata validation
        run: ./hack/check-version-consistency_test.sh

      - name: Test release source validation
        run: ./hack/check-release-source_test.sh

      - name: Test catalog updates
        run: python -m unittest discover -s hack -p '*_test.py' -v

      - name: Validate release metadata
        id: validate
        run: |
          ./hack/check-version-consistency.sh
          version="$(sed -n 's/^VERSION ?= //p' src/Makefile)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Run unit tests
        working-directory: src
        run: CGO_ENABLED=1 go test -race ./...

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Cache envtest binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/bin/k8s
          key: envtest-${{ runner.os }}-k8s-${{ env.ENVTEST_K8S_VERSION }}

      - name: Set up envtest
        working-directory: src
        run: |
          GOBIN="$(pwd)/bin" go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.24
          ASSETS="$(./bin/setup-envtest use "${ENVTEST_K8S_VERSION}" --bin-dir "$(pwd)/bin" -p path)"
          echo "KUBEBUILDER_ASSETS=$ASSETS" >> "$GITHUB_ENV"

      - name: Run integration tests
        working-directory: src
        run: CGO_ENABLED=1 go test -race ./controllers/...

  build-operator:
    name: Build operator image
    needs: [release-metadata, unit, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/neteye-operator
          tags: |
            type=ref,event=pr

      - name: Build operator image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src
          file: src/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.release-metadata.outputs.version }}
          provenance: mode=max
          sbom: true
  build-bundle:
    name: Build bundle image
    needs: [release-metadata, unit, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/neteye-operator-bundle
          tags: |
            type=ref,event=pr

      - name: Build bundle image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src
          file: src/Dockerfile.bundle
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release-metadata.outputs.version }}
            PACKAGE_NAME=neteye-operator
          provenance: mode=max
          sbom: true

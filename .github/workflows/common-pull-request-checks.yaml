name: Common Pull Request Checks

on:
  pull_request:
    branches:
      - "**"

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common-pull-request-checks:
    uses: neteye-platform/repo-commons/.github/workflows/common-pull-request-checks.yaml@3e97f3c17ac7605141446cf3dc5cb3abc606c452 # main
    secrets: inherit

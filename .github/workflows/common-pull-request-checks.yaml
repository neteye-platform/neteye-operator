name: Common Pull Request Checks

on:
  pull_request:
    branches:
      - "**"

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common-pull-request-checks:
    uses: neteye-platform/repo-commons/.github/workflows/common-pull-request-checks.yaml@4e30dd80d90a03104198b5fe0b9d93664b4d3c53 # main
    secrets: inherit

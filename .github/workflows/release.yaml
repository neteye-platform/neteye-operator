name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New SemVer version to release, e.g. 0.2.0. Leave empty to auto-derive from merged PR labels since the last release."
        required: false

permissions:
  contents: read

jobs:
  bump-and-tag:
    name: Bump version and push release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create write token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.NETEYE_APP_ID }}
          private-key: ${{ secrets.NETEYE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: neteye-operator
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Configure git identity
        run: |
          git config user.name "Davide Sbetti"
          git config user.email "WN00188966@wgs.wuerth.com"

      # Bump type is derived from the labels of PRs merged to main since the
      # last stable release tag: "feature" -> minor, everything else
      # (bugfix/dependencies/major/unlabeled) -> patch, except "feature"
      # which bumps minor. Major bumps are treated as minor for now instead
      # of requiring a human release.
      - name: Determine version
        id: version
        if: ${{ inputs.version == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # git tag --list uses glob matching, not regex, so 'v[0-9]*.[0-9]*.[0-9]*'
          # also matches prerelease tags like v0.1.1-alpha.3; filter those out.
          last_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)"
          if [[ -z "$last_tag" ]]; then
            echo "error: no previous stable release tag found" >&2
            exit 1
          fi
          last_version="${last_tag#v}"
          since="$(git log -1 --format=%aI "$last_tag")"

          labels="$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main \
            --search "merged:>=${since}" --json labels --jq '.[].labels[].name')"

          bump="patch"
          grep -qx 'feature' <<<"$labels" && bump="minor"
          grep -qx 'major' <<<"$labels" && bump="minor"

          IFS='.' read -r major minor patch <<<"$last_version"
          if [[ "$bump" == minor ]]; then
            version="${major}.$((minor + 1)).0"
          else
            version="${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Bump version
        env:
          VERSION: ${{ inputs.version != '' && inputs.version || steps.version.outputs.version }}
        run: ./hack/bump-version.sh "$VERSION"

      - name: Open release pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ inputs.version != '' && inputs.version || steps.version.outputs.version }}
        run: |
          branch="release-version-$VERSION"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore: bump version to $VERSION"
          git push origin "$branch"
          url="$(gh pr create --base main --head "$branch" \
            --title "chore: release v$VERSION" \
            --body "Automated release of v$VERSION.")"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

      - name: Merge release pull request
        id: merge
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          # --admin bypasses required reviews/checks; the App must be on the
          # target branch ruleset's bypass list for this to succeed
          gh pr merge "${{ steps.pr.outputs.number }}" --squash --admin --delete-branch
          sha="$(gh pr view "${{ steps.pr.outputs.number }}" --json mergeCommit --jq .mergeCommit.oid)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Create signed release tag
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ inputs.version != '' && inputs.version || steps.version.outputs.version }}
        run: |
          # created via the Git Data API with no custom tagger, so GitHub
          # bot-signs it on the App's behalf and shows it as Verified
          tag_sha="$(gh api "repos/${{ github.repository }}/git/tags" \
            -f tag="v$VERSION" \
            -f message="v$VERSION" \
            -f object="${{ steps.merge.outputs.sha }}" \
            -f type=commit \
            --jq .sha)"
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/v$VERSION" \
            -f sha="$tag_sha"

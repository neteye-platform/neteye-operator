apiVersion: neteye.cloud/v1
kind: KeycloakRealm
metadata:
  name: test
  namespace: keycloak

spec:
  realm: test

  displayName: NetEye-test
  displayNameHtml: ""

  defaultSignatureAlgorithm: RS256

  revokeRefreshToken: false
  refreshTokenMaxReuse: 0

  accessTokenLifespan: 60
  accessTokenLifespanForImplicitFlow: 900

  ssoSessionIdleTimeout: 1800
  ssoSessionMaxLifespan: 36000
  ssoSessionIdleTimeoutRememberMe: 1728000000
  ssoSessionMaxLifespanRememberMe: 1728000000

  offlineSessionIdleTimeout: 2592000
  offlineSessionMaxLifespanEnabled: false
  offlineSessionMaxLifespan: 5184000

  clientSessionIdleTimeout: 0
  clientSessionMaxLifespan: 0
  clientOfflineSessionIdleTimeout: 0
  clientOfflineSessionMaxLifespan: 0

  accessCodeLifespan: 60
  accessCodeLifespanUserAction: 300
  accessCodeLifespanLogin: 1800

  actionTokenGeneratedByAdminLifespan: 43200
  actionTokenGeneratedByUserLifespan: 300

  oauth2DeviceCodeLifespan: 600
  oauth2DevicePollingInterval: 5

  enabled: true
  sslRequired: external

  registrationAllowed: false
  registrationEmailAsUsername: false
  rememberMe: true
  verifyEmail: false
  loginWithEmailAllowed: false
  duplicateEmailsAllowed: true
  resetPasswordAllowed: false
  editUsernameAllowed: true

  bruteForceProtected: true
  permanentLockout: false
  maxTemporaryLockouts: 0
  bruteForceStrategy: MULTIPLE
  maxFailureWaitSeconds: 900
  minimumQuickLoginWaitSeconds: 60
  waitIncrementSeconds: 60
  quickLoginCheckMilliSeconds: 1000
  maxDeltaTimeSeconds: 43200
  failureFactor: 30
  maxSecondaryAuthFailures: 0

  otpPolicyType: totp
  otpPolicyAlgorithm: HmacSHA1
  otpPolicyInitialCounter: 0
  otpPolicyDigits: 6
  otpPolicyLookAheadWindow: 1
  otpPolicyPeriod: 30
  otpPolicyCodeReusable: false

  otpSupportedApplications:
    - totpAppFreeOTPName
    - totpAppGoogleName
    - totpAppMicrosoftAuthenticatorName

  webAuthnPolicyRpEntityName: keycloak

  webAuthnPolicySignatureAlgorithms:
    - ES256

  webAuthnPolicyRpId: ""
  webAuthnPolicyAttestationConveyancePreference: not specified
  webAuthnPolicyAuthenticatorAttachment: not specified
  webAuthnPolicyRequireResidentKey: not specified
  webAuthnPolicyResidentKey: not specified
  webAuthnPolicyUserVerificationRequirement: not specified
  webAuthnPolicyCreateTimeout: 0
  webAuthnPolicyAvoidSameAuthenticatorRegister: false

  webAuthnPolicyAcceptableAaguids: []
  webAuthnPolicyExtraOrigins: []

  webAuthnPolicyPasswordlessRpEntityName: keycloak

  webAuthnPolicyPasswordlessSignatureAlgorithms:
    - ES256

  webAuthnPolicyPasswordlessRpId: ""
  webAuthnPolicyPasswordlessAttestationConveyancePreference: not specified
  webAuthnPolicyPasswordlessAuthenticatorAttachment: not specified
  webAuthnPolicyPasswordlessRequireResidentKey: not specified
  webAuthnPolicyPasswordlessResidentKey: required
  webAuthnPolicyPasswordlessUserVerificationRequirement: not specified
  webAuthnPolicyPasswordlessCreateTimeout: 0
  webAuthnPolicyPasswordlessAvoidSameAuthenticatorRegister: false

  webAuthnPolicyPasswordlessAcceptableAaguids: []
  webAuthnPolicyPasswordlessExtraOrigins: []

  loginTheme: neteye
  accountTheme: neteye
  adminTheme: neteye
  emailTheme: neteye

  eventsEnabled: true
  eventsExpiration: 2592000

  eventsListeners:
    - jboss-logging

  enabledEventTypes:
    - SEND_RESET_PASSWORD
    - UPDATE_CONSENT_ERROR
    - GRANT_CONSENT
    - VERIFY_PROFILE_ERROR
    - REMOVE_TOTP
    - REVOKE_GRANT
    - UPDATE_TOTP
    - LOGIN_ERROR
    - CLIENT_LOGIN
    - RESET_PASSWORD_ERROR
    - UPDATE_CREDENTIAL
    - IMPERSONATE_ERROR
    - CODE_TO_TOKEN_ERROR
    - CUSTOM_REQUIRED_ACTION
    - OAUTH2_DEVICE_CODE_TO_TOKEN_ERROR
    - RESTART_AUTHENTICATION
    - IMPERSONATE
    - UPDATE_PROFILE_ERROR
    - LOGIN
    - OAUTH2_DEVICE_VERIFY_USER_CODE
    - UPDATE_PASSWORD_ERROR
    - CLIENT_INITIATED_ACCOUNT_LINKING
    - OAUTH2_EXTENSION_GRANT
    - USER_DISABLED_BY_PERMANENT_LOCKOUT
    - REMOVE_CREDENTIAL_ERROR
    - TOKEN_EXCHANGE
    - AUTHREQID_TO_TOKEN
    - LOGOUT
    - REGISTER
    - DELETE_ACCOUNT_ERROR
    - CLIENT_REGISTER
    - IDENTITY_PROVIDER_LINK_ACCOUNT
    - USER_DISABLED_BY_TEMPORARY_LOCKOUT
    - DELETE_ACCOUNT
    - UPDATE_PASSWORD
    - CLIENT_DELETE
    - FEDERATED_IDENTITY_LINK_ERROR
    - IDENTITY_PROVIDER_FIRST_LOGIN
    - CLIENT_DELETE_ERROR
    - VERIFY_EMAIL
    - CLIENT_LOGIN_ERROR
    - RESTART_AUTHENTICATION_ERROR
    - EXECUTE_ACTIONS
    - REMOVE_FEDERATED_IDENTITY_ERROR
    - TOKEN_EXCHANGE_ERROR
    - PERMISSION_TOKEN
    - FEDERATED_IDENTITY_OVERRIDE_LINK
    - SEND_IDENTITY_PROVIDER_LINK_ERROR
    - UPDATE_CREDENTIAL_ERROR
    - EXECUTE_ACTION_TOKEN_ERROR
    - OAUTH2_EXTENSION_GRANT_ERROR
    - SEND_VERIFY_EMAIL
    - OAUTH2_DEVICE_AUTH
    - EXECUTE_ACTIONS_ERROR
    - REMOVE_FEDERATED_IDENTITY
    - OAUTH2_DEVICE_CODE_TO_TOKEN
    - IDENTITY_PROVIDER_POST_LOGIN
    - IDENTITY_PROVIDER_LINK_ACCOUNT_ERROR
    - FEDERATED_IDENTITY_OVERRIDE_LINK_ERROR
    - OAUTH2_DEVICE_VERIFY_USER_CODE_ERROR
    - UPDATE_EMAIL
    - REGISTER_ERROR
    - REVOKE_GRANT_ERROR
    - EXECUTE_ACTION_TOKEN
    - LOGOUT_ERROR
    - UPDATE_EMAIL_ERROR
    - CLIENT_UPDATE_ERROR
    - AUTHREQID_TO_TOKEN_ERROR
    - INVITE_ORG_ERROR
    - UPDATE_PROFILE
    - CLIENT_REGISTER_ERROR
    - FEDERATED_IDENTITY_LINK
    - INVITE_ORG
    - SEND_IDENTITY_PROVIDER_LINK
    - SEND_VERIFY_EMAIL_ERROR
    - RESET_PASSWORD
    - CLIENT_INITIATED_ACCOUNT_LINKING_ERROR
    - OAUTH2_DEVICE_AUTH_ERROR
    - REMOVE_CREDENTIAL
    - UPDATE_CONSENT
    - REMOVE_TOTP_ERROR
    - VERIFY_EMAIL_ERROR
    - SEND_RESET_PASSWORD_ERROR
    - CLIENT_UPDATE
    - CUSTOM_REQUIRED_ACTION_ERROR
    - IDENTITY_PROVIDER_POST_LOGIN_ERROR
    - UPDATE_TOTP_ERROR
    - CODE_TO_TOKEN
    - VERIFY_PROFILE
    - GRANT_CONSENT_ERROR
    - IDENTITY_PROVIDER_FIRST_LOGIN_ERROR

  adminEventsEnabled: true
  adminEventsDetailsEnabled: true

  internationalizationEnabled: false

  attributes:
    cibaBackchannelTokenDeliveryMode: poll
    cibaAuthRequestedUserHint: login_hint
    clientOfflineSessionMaxLifespan: "0"
    oauth2DevicePollingInterval: "5"
    clientSessionIdleTimeout: "0"
    clientOfflineSessionIdleTimeout: "0"
    cibaInterval: "5"
    realmReusableOtpCode: "false"
    cibaExpiresIn: "120"
    oauth2DeviceCodeLifespan: "600"
    parRequestUriLifespan: "60"
    clientSessionMaxLifespan: "0"
    adminEventsExpiration: "5184000"

  userManagedAccessAllowed: false
  organizationsEnabled: false
  verifiableCredentialsEnabled: false
  adminPermissionsEnabled: false
  scimApiEnabled: false
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-authflow-controller
  namespace: keycloak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-authflow-controller
  namespace: keycloak
rules:
  - apiGroups:
      - neteye.cloud
    resources:
      - keycloakauthflows
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - neteye.cloud
    resources:
      - keycloakauthflows/status
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-authflow-controller
  namespace: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-authflow-controller
subjects:
  - kind: ServiceAccount
    name: keycloak-authflow-controller
    namespace: keycloak
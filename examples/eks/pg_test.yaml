# Warning: This file is used only for testing purposes. It is not intended for production use.
apiVersion: v1
kind: Namespace
metadata:
  name: pg-test
---
apiVersion: v1
kind: Pod
metadata:
  name: pg-test
  namespace: pg-test
  labels:
    app: pg-test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: postgres
      image: docker.io/library/postgres:18
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      env:
        - name: POSTGRES_USER
          value: test
        - name: POSTGRES_PASSWORD
          value: test
        - name: POSTGRES_DB
          value: keycloak
      ports:
        - name: postgres
          containerPort: 5432
      volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
        - name: run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: data
      emptyDir: {}
    - name: run
      emptyDir: {}
    - name: tmp
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pg-test
  namespace: pg-test
spec:
  selector:
    app: pg-test
  type:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

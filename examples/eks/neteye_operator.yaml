apiVersion: v1
kind: Namespace
metadata:
  name: neteye-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak-system
---
apiVersion: olm.operatorframework.io/v1
kind: ClusterExtension
metadata:
  name: neteye-operator
spec:
  namespace: neteye-system
  source:
    sourceType: Catalog
    catalog:
      packageName: neteye-operator
      channels:
        - 4.51-stable
      version: "=0.2.11"
      upgradeConstraintPolicy: CatalogProvided
      selector:
        matchLabels:
          olm.operatorframework.io/metadata.name: neteye
  install:
    preflight:
      crdUpgradeSafety:
        enforcement: Strict

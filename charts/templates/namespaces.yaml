{{- range $namespace := list .Values.keycloak.namespace .Values.operator.namespace .Values.operator.sharedNamespace }}
{{- if not (lookup "v1" "Namespace" "" $namespace) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace | quote}}
  annotations:
    helm.sh/resource-policy: keep
{{- end }}
{{- end }}

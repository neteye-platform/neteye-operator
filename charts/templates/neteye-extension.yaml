apiVersion: olm.operatorframework.io/v1
kind: ClusterExtension
metadata:
  name: {{ .Values.operator.packageName | quote }}
spec:
  namespace: {{ .Values.namespace.operators | quote }}
  source:
    sourceType: Catalog
    catalog:
      packageName: {{ .Values.operator.packageName | quote }}
      channels:
      - {{ .Values.operator.channel | quote }}
      version: {{ .Values.operator.versionRange | quote }}
      upgradeConstraintPolicy: {{ .Values.operator.upgradeConstraintPolicy | quote }}
      selector:
        matchLabels:
          olm.example.io/catalog: {{ .Values.operator.catalogName | quote }}
  install:
    preflight:
      crdUpgradeSafety:
        enforcement: Strict

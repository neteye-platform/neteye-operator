              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetEyeSpec defines the desired state of NetEye.
            properties:
              neteyeVersion:
                description: |-
                  NetEyeVersion is the NetEye product version to deploy, e.g. "4.36".
                  It resolves the component images of every managed service: the admin
                  declares a product version, never an image tag.
                example: "4.36"
                minLength: 1
                type: string
              services:
                description: |-
                  Services selects which managed services this NetEye instance is made of
                  and carries their per-service tunables. A service left unset is not
                  deployed; a service that was set and is then removed is torn down.
                properties:
                  keycloak:
                    description: Keycloak deploys the NetEye identity provider.
                    properties:
                      additionalOptions:
                        description: |-
                          AdditionalOptions overrides the operator's compiled-in defaults for
                          individual enforced Keycloak settings.
                        items:
                          description: |-
                            ServiceOption is a single setting override: it replaces the operator's
                            compiled-in default for one enforced setting.

                            Only names the operator recognises have an effect. An unrecognised name is
                            ignored rather than rejected, so a CR written for a newer operator still
                            reconciles on an older one; the ignored names are reported on
                            status.conditions rather than failing the object.

                            Overriding a setting does not make it unenforced: the resulting value is
                            still re-asserted on every reconcile pass.
                          properties:
                            name:
                              description: Name of the setting to override, e.g. "loginTheme".
                              minLength: 1
                              type: string
                            value:
                              description: Value to enforce instead of the operator's
                                default.
                              type: string
                          required:
                          - name
                          - value
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      hostname:

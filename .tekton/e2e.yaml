---
# Manually chained from nightly-build.yaml (last step of update-nightly-catalog
# fires this via the PAC incoming webhook). Requires, in the target
# cluster/namespace (not managed here):
#   - Repository CR with an `incoming` entry targeting branch "main"
#   - Secret referenced by that entry (the shared incoming-webhook secret)
#   - A ServiceAccount for this PipelineRun with RBAC to create/get
#     PipelineRuns in its own namespace (rd-neteye-pipeline on OpenShift,
#     rd-pipelines on plat-eng-prod-bz-01), where the rhel8-neteye-build
#     PipelineRuns of si-rd-tekton-pipelines are created
#
# It runs on either cluster, whichever the PAC incoming webhook reaches: the
# child PipelineRuns go to the namespace of this run, and their account,
# storage class and pod identity are chosen by the API groups the cluster
# serves (OpenShift Routes or not). Drop the OpenShift branch once the
# pipelines have moved to plat-eng-prod-bz-01.
#
# Triggers the "install", "update" and "upgrade" e2e pipelines as three
# independent tasks, run in parallel once verify-revision has passed.
# Each task shares the same taskSpec (via YAML anchor/alias) and only differs
# in the literal "neteye-update-upgrade" value it passes in; the shared script
# retries its own PipelineRun up to max_attempts times, stopping as soon as
# one attempt succeeds.
# Release itself stays a GitHub Actions workflow (.github/workflows/release.yaml),
# triggered directly by its `check_run: completed` handler reacting to the
# GitHub Check Run PAC reports for this PipelineRun (named "e2e") - no
# dispatch call needed from here.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: neteye-operator-e2e
  annotations:
    pipelinesascode.tekton.dev/on-event: "[incoming]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  # Must cover max_attempts (3) sequential child PipelineRuns of up to 5h each.
  timeouts:
    pipeline: "8h0m0s"
  params:
    # Filled by PAC from the incoming webhook params (see nightly-build.yaml).
    - name: operator-nightly-version
      value: "{{ operator-nightly-version }}"
    - name: operator-nightly-channel
      value: "{{ operator-nightly-channel }}"
    - name: neteye-version
      value: latest
    - name: revision
      value: "{{ revision }}"
  pipelineSpec:
    params:
      - name: operator-nightly-version
        type: string
      - name: operator-nightly-channel
        type: string
      - name: neteye-version
        type: string
        default: latest
      - name: revision
        type: string
    tasks:
      # PAC resolves "main" when the webhook arrives, which can be newer than
      # the commit the nightly images were built from. The release tags the
      # commit this check reports on, so they must match.
      - name: verify-revision
        params:
          - name: operator-nightly-version
            value: $(params.operator-nightly-version)
          - name: revision
            value: $(params.revision)
        taskSpec:
          params:
            - name: operator-nightly-version
              type: string
            - name: revision
              type: string
          steps:
            - name: verify
              image: ghcr.io/witglobal/oc-cli-tools:1.1.0@sha256:404155df46f632761680eb70f3473746c4eecb6c55c89dd6b39adf8276ee85a8
              env:
                - name: OPERATOR_NIGHTLY_VERSION
                  value: $(params.operator-nightly-version)
                - name: REVISION
                  value: $(params.revision)
              script: |
                #!/usr/bin/env bash
                set -euo pipefail
                if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "Invalid revision: '$REVISION'" >&2
                  exit 1
                fi
                if [[ "$OPERATOR_NIGHTLY_VERSION" != *"-nightly-${REVISION:0:12}" ]]; then
                  echo "Nightly '$OPERATOR_NIGHTLY_VERSION' was not built from $REVISION (main moved during the nightly build)" >&2
                  exit 1
                fi
                echo "Nightly '$OPERATOR_NIGHTLY_VERSION' matches $REVISION"
      - name: install
        runAfter: [verify-revision]
        params:
          - name: operator-nightly-version
            value: $(params.operator-nightly-version)
          - name: operator-nightly-channel
            value: $(params.operator-nightly-channel)
          - name: neteye-version
            value: $(params.neteye-version)
          - name: neteye-update-upgrade
            value: none
        taskSpec: &e2eTaskSpec
          params:
            - name: operator-nightly-version
              type: string
            - name: operator-nightly-channel
              type: string
            - name: neteye-version
              type: string
              default: latest
            - name: neteye-update-upgrade
              type: string
              default: none
          steps:
            - name: run-e2e-operator-tests
              image: ghcr.io/witglobal/oc-cli-tools:1.1.0@sha256:404155df46f632761680eb70f3473746c4eecb6c55c89dd6b39adf8276ee85a8
              env:
                - name: HOME
                  value: /tekton/home
                - name: OPERATOR_NIGHTLY_VERSION
                  value: $(params.operator-nightly-version)
                # The child PipelineRuns go to the namespace of this run (where the PAC Repository is)
                - name: NAMESPACE
                  value: $(context.taskRun.namespace)
                - name: NETEYE_VERSION
                  value: $(params.neteye-version)
                - name: OPERATOR_NIGHTLY_CHANNEL
                  value: $(params.operator-nightly-channel)
                - name: NETEYE_UPDATE_UPGRADE
                  value: $(params.neteye-update-upgrade)
              script: |
                #!/usr/bin/env bash
                set -euo pipefail

                case "$NETEYE_UPDATE_UPGRADE" in
                  none) run_mode=install ;;
                  update|upgrade) run_mode="$NETEYE_UPDATE_UPGRADE" ;;
                  *) echo "Invalid neteye-update-upgrade value: $NETEYE_UPDATE_UPGRADE" >&2; exit 1 ;;
                esac

                if [[ ! "$OPERATOR_NIGHTLY_CHANNEL" =~ ^[0-9]+\.[0-9]+-nightly$ ]]; then
                  echo "Invalid operator-nightly-channel (expected <major>.<minor>-nightly): '$OPERATOR_NIGHTLY_CHANNEL'" >&2
                  exit 1
                fi

                # Tell the cluster by the API groups it serves, and refuse to guess when they cannot be read.
                if out="$(oc get --raw /apis/route.openshift.io/v1 2>&1)"; then
                  platform=openshift
                elif grep -q NotFound <<<"$out"; then
                  platform=plat-eng-prod-bz-01
                else
                  echo "Cannot tell which cluster this is: $out" >&2
                  exit 1
                fi
                if [[ "$platform" == openshift ]]; then
                  service_account=openshift-pipelines
                  storage_class=ocs-storagecluster-cephfs-sing-rep
                  # The SCC gives every step UID 1000 and the fsGroup of the namespace.
                  pod_template=""
                else
                  service_account=default
                  storage_class=longhorn
                  # The identity the OpenShift SCC gives these pods, set by hand: one UID for every task (clone,
                  # Terraform and playbooks share the workspace directories) and a writable workspace.
                  pod_template="$(printf '%s\n' \
                    '      podTemplate:' \
                    '        securityContext:' \
                    '          runAsUser: 1000' \
                    '          fsGroup: 1001100000')"
                fi
                echo "Platform: $platform (namespace $NAMESPACE, account $service_account, storage class $storage_class)"

                attempt=0
                max_attempts=3

                while (( attempt < max_attempts )); do
                  attempt=$((attempt + 1))
                  name="$(oc create -n "$NAMESPACE" -f - <<EOF | awk -F/ '{print $2}' | awk '{print $1}'
                  apiVersion: tekton.dev/v1
                  kind: PipelineRun
                  metadata:
                    generateName: neteye-operator-e2e-${run_mode}-$(date -u +%Y%m%d%H%M%S)-
                    annotations:
                      neteye.cloud/operator-nightly-version: "$OPERATOR_NIGHTLY_VERSION"
                      neteye.cloud/operator-nightly-channel: "$OPERATOR_NIGHTLY_CHANNEL"
                      neteye.cloud/neteye-update-upgrade: "$NETEYE_UPDATE_UPGRADE"
                      neteye.cloud/neteye-version: "$NETEYE_VERSION"
                  spec:
                    pipelineRef:
                      resolver: git
                      params:
                        - name: gitToken
                          value: "git-resolver"
                        - name: pathInRepo
                          value: rhel8-neteye-build/rhel8-neteye-build.yaml
                    taskRunTemplate:
                      serviceAccountName: ${service_account}
                ${pod_template}
                    timeouts:
                      pipeline: "3h30m0s"
                    workspaces:
                      - name: shared-workspace
                        volumeClaimTemplate:
                          spec:
                            storageClassName: ${storage_class}
                            volumeMode: Filesystem
                            accessModes: ["ReadWriteMany"]
                            resources:
                              requests:
                                storage: 1Gi
                    params:
                      - name: projects
                        value: "neteye-ci-dummy"
                      - name: version
                        value: "$NETEYE_VERSION"
                      - name: neteyeOperatorChannel
                        value: "$OPERATOR_NIGHTLY_CHANNEL"
                      - name: neteyeOperatorVersion
                        value: "$OPERATOR_NIGHTLY_VERSION"
                      - name: neteyeUpdateUpgrade
                        value: "$NETEYE_UPDATE_UPGRADE"
                EOF
                  )"
                  echo "Attempt $attempt: created PipelineRun $name"

                  status=""
                  while [[ -z "$status" || "$status" == "Unknown" ]]; do
                    status="$(oc get pipelinerun "$name" -n "$NAMESPACE" \
                      -o jsonpath='{.status.conditions[?(@.type=="Succeeded")].status}' \
                      2>/dev/null || true)"
                    if [[ -z "$status" || "$status" == "Unknown" ]]; then
                      sleep 3
                    fi
                  done

                  if [[ "$status" == "True" ]]; then
                    echo "Succeeded"
                    exit 0
                  fi

                  if (( attempt >= max_attempts )); then
                    echo "Giving up after attempt $attempt: retry limit reached"
                    exit 1
                  fi

                  echo "Attempt $attempt failed, retrying in 3s"
                  sleep 3
                done
      - name: update
        runAfter: [verify-revision]
        params:
          - name: operator-nightly-version
            value: $(params.operator-nightly-version)
          - name: operator-nightly-channel
            value: $(params.operator-nightly-channel)
          - name: neteye-version
            value: $(params.neteye-version)
          - name: neteye-update-upgrade
            value: update
        taskSpec: *e2eTaskSpec
      - name: upgrade
        runAfter: [verify-revision]
        params:
          - name: operator-nightly-version
            value: $(params.operator-nightly-version)
          - name: operator-nightly-channel
            value: $(params.operator-nightly-channel)
          - name: neteye-version
            value: current
          - name: neteye-update-upgrade
            value: upgrade
        taskSpec: *e2eTaskSpec

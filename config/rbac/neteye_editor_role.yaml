# This rule is not used by the project neteye-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the neteye.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: neteye-operator
    app.kubernetes.io/managed-by: kustomize
  name: neteye-editor-role
rules:
- apiGroups:
  - neteye.com
  resources:
  - neteyes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - neteye.com
  resources:
  - neteyes/status
  verbs:
  - get

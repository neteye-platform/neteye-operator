extends: default

rules:
  line-length: disable
  braces:
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  truthy:
    check-keys: false
  # controller-gen, kustomize and operator-sdk own the layout of their output.
  indentation:
    ignore: |
      src/bundle/
      src/config/crd/bases/
      src/config/manifests/bases/
      src/config/manifests/kustomization.yaml
  document-start: disable

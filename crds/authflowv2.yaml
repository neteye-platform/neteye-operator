apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: keycloakauthflows.neteye.cloud
spec:
  group: neteye.cloud
  names:
    kind: KeycloakAuthFlow
    listKind: KeycloakAuthFlowList
    plural: keycloakauthflows
    singular: keycloakauthflow
    shortNames:
      - kcflow
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true

      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.value

      schema:
        openAPIV3Schema:
          type: object
          description: Keycloak authentication flow.

          properties:
            spec:
              type: object
              description: Desired Keycloak authentication flow.
              required:
                - alias
                - realm
                - executions

              properties:
                alias:
                  type: string
                  description: Alias of the authentication flow.

                realm:
                  type: string
                  description: Keycloak realm where the flow is created.

                executions:
                  type: array
                  description: Executions and nested subflows.
                  items:
                    type: object
                    description: Authentication execution or nested subflow.

                    required:
                      - requirement

                    properties:
                      requirement:
                        type: string
                        description: Requirement of the execution or subflow.
                        enum:
                          - REQUIRED
                          - ALTERNATIVE
                          - DISABLED
                          - CONDITIONAL

                      authenticator:
                        type: string
                        description: Keycloak authenticator provider ID.

                      alias:
                        type: string
                        description: Alias of the execution.

                      config:
                        type: object
                        description: Authenticator configuration.
                        properties:
                          alias:
                            type: string
                            description: Alias of the authenticator configuration.

                          config:
                            type: object
                            description: Authenticator configuration values.
                            additionalProperties:
                              type: string

                      flow:
                        type: object
                        description: Nested authentication subflow.

                        required:
                          - alias
                          - executions

                        properties:
                          alias:
                            type: string
                            description: Alias of the nested authentication flow.

                          provider:
                            type: string
                            description: Provider type of the nested flow.
                            enum:
                              - basic-flow
                              - form-flow
                            default: basic-flow

                          executions:
                            type: array
                            description: Executions and nested subflows.
                            items:
                              type: object
                              description: Authentication execution or nested subflow.

                              required:
                                - requirement

                              properties:
                                requirement:
                                  type: string
                                  enum:
                                    - REQUIRED
                                    - ALTERNATIVE
                                    - DISABLED
                                    - CONDITIONAL

                                authenticator:
                                  type: string
                                  description: Keycloak authenticator provider ID.

                                alias:
                                  type: string
                                  description: Alias of the execution.

                                config:
                                  type: object
                                  description: Authenticator configuration.
                                  properties:
                                    alias:
                                      type: string
                                      description: Alias of the authenticator configuration.

                                    config:
                                      type: object
                                      description: Authenticator configuration values.
                                      additionalProperties:
                                        type: string

                                flow:
                                  type: object
                                  description: Nested authentication subflow.

                                  required:
                                    - alias
                                    - executions

                                  properties:
                                    alias:
                                      type: string

                                    provider:
                                      type: string
                                      enum:
                                        - basic-flow
                                        - form-flow
                                      default: basic-flow

                                    executions:
                                      type: array
                                      items:
                                        type: object
                                        description: Authentication execution or nested subflow.

                                        required:
                                          - requirement

                                        properties:
                                          requirement:
                                            type: string
                                            enum:
                                              - REQUIRED
                                              - ALTERNATIVE
                                              - DISABLED
                                              - CONDITIONAL

                                          authenticator:
                                            type: string

                                          alias:
                                            type: string

                                          config:
                                            type: object
                                            properties:
                                              alias:
                                                type: string
                                              config:
                                                type: object
                                                additionalProperties:
                                                  type: string

            status:
              type: object
              properties:
                id:
                  type: string
                  description: Keycloak internal ID of the authentication flow.

                value:
                  type: string
                  description: Reconciliation status.

      subresources:
        status: {}